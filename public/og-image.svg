<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="g1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#C8542B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8542B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="95%" r="50%">
      <stop offset="0%" stop-color="#4F5D38" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4F5D38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8542B"/>
      <stop offset="100%" stop-color="#B08436"/>
    </linearGradient>
    <style>
      .display { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
      .body { font-family: 'Geist', system-ui, sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: 4px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F4EFE3"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Brand mark top-left -->
  <text x="60" y="100" class="display" font-size="40" fill="#1C1A16">Claude<tspan fill="#C8542B" font-style="normal">·101</tspan></text>
  <text x="60" y="128" class="mono" font-size="14" fill="#756B5B">Curso de formación</text>

  <!-- Main title -->
  <text x="60" y="280" class="display" font-size="92" fill="#1C1A16">Aprende a trabajar</text>
  <text x="60" y="380" class="display" font-size="92" fill="#1C1A16">con <tspan font-style="normal" fill="#C8542B">Claude</tspan>, en serio</text>

  <!-- Subtitle -->
  <text x="60" y="440" class="body" font-size="24" fill="#3A352D">El único curso completo en español. 8 módulos · acceso vitalicio.</text>

  <!-- Pricing pill -->
  <rect x="60" y="490" width="200" height="56" rx="28" fill="url(#g3)"/>
  <text x="160" y="525" class="body" font-size="22" fill="#F4EFE3" text-anchor="middle" font-weight="600">49 € · pago único</text>

  <!-- Three model cards (mini visual) -->
  <g transform="translate(700, 200)">
    <rect width="140" height="160" rx="16" fill="#FBF8F0" stroke="#E1D8C2" stroke-width="2"/>
    <text x="70" y="60" class="display" font-size="28" fill="#4F5D38" text-anchor="middle">Haiku</text>
    <text x="70" y="90" class="mono" font-size="10" fill="#756B5B" text-anchor="middle">Rápido</text>

    <rect x="160" y="-12" width="140" height="184" rx="16" fill="#FBF8F0" stroke="#C8542B" stroke-width="3"/>
    <text x="230" y="60" class="display" font-size="28" fill="#C8542B" text-anchor="middle">Sonnet</text>
    <text x="230" y="90" class="mono" font-size="10" fill="#C8542B" text-anchor="middle">Por defecto</text>
    <circle cx="230" cy="130" r="6" fill="#C8542B"/>

    <rect x="320" y="0" width="140" height="160" rx="16" fill="#FBF8F0" stroke="#E1D8C2" stroke-width="2"/>
    <text x="390" y="60" class="display" font-size="28" fill="#B08436" text-anchor="middle">Opus</text>
    <text x="390" y="90" class="mono" font-size="10" fill="#756B5B" text-anchor="middle">Potente</text>
  </g>

  <!-- Bottom meta strip -->
  <text x="60" y="585" class="mono" font-size="13" fill="#756B5B">8 módulos · 32 lecciones · prompts copiables · acceso vitalicio · 14 días garantía</text>
</svg>
