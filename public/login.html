.wrap { min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">Claude<em>·101</em></a>
    <div class="nav-links"><a href="/">← Volver</a></div>
  </div>
</nav>

<div class="wrap">
  <div class="card box">
    <h1 class="h-display">Entra a <em>tu curso</em></h1>
    <p class="sub">Escribe el email con el que compraste. Te mandamos un enlace de acceso. Sin contraseñas.</p>

    <div id="alerts"></div>

    <form id="loginForm" onsubmit="return sendLink(event)">
      <label class="label" for="email">Email</label>
      <input type="email" id="email" name="email" class="input" placeholder="tu@email.com" required autocomplete="email">
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="sendBtn">Enviar enlace de acceso</button>
    </form>

    <div class="oauth-divider" id="oauthBlock" style="display:none;">
      <span>o</span>
    </div>
    <a href="/api/auth/google" class="btn btn-ghost btn-block btn-lg google-btn" id="googleBtn" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="margin-right:8px;">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.17-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.26h2.9c1.7-1.56 2.69-3.87 2.69-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.41 5.41 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.99-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continuar con Google
    </a>

    <p class="tip">¿No has comprado todavía? <a href="/#precio">Empezar el curso →</a></p>
  </div>
</div>

<style>
.oauth-divider { display:flex; align-items:center; gap:12px; margin: 18px 0 12px; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; }
.oauth-divider::before, .oauth-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.google-btn { background: white; color: var(--ink); border-color: var(--line-2); }
.google-btn:hover { background: var(--bg-2); border-color: var(--ink-2); color: var(--ink); }
</style>

<script>
function showAlert(type, msg) {
  document.getElementById('alerts').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

(function checkUrl() {
  const sp = new URLSearchParams(location.search);
  const err = sp.get('error');
  if (err === 'expired') showAlert('error', 'Ese enlace ya caducó. Pide uno nuevo aquí abajo.');
  if (err === 'used') showAlert('error', 'Ese enlace ya se usó. Pide uno nuevo.');
  if (err === 'invalid') showAlert('error', 'El enlace no es válido. Revisa el email o pide uno nuevo.');
  if (err === 'missing') showAlert('error', 'Falta el token. Pide un enlace nuevo abajo.');
  if (err === 'google_disabled') showAlert('info', 'Login con Google no está disponible ahora. Usa el email.');
  if (err === 'oauth_state') showAlert('error', 'La sesión de OAuth expiró. Inténtalo de nuevo.');
  if (err === 'oauth_failed') showAlert('error', 'No se pudo iniciar sesión con Google. Inténtalo con email.');
  if (err === 'oauth_no_email') showAlert('error', 'Tu cuenta de Google no tiene email verificado.');
})();

// Mostrar el botón de Google solo si está configurado en el server
(async function checkGoogle() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (s.features?.google_oauth) {
      document.getElementById('googleBtn').style.display = '';
      document.getElementById('oauthBlock').style.display = 'flex';
    }
  } catch {}
})();

async function sendLink(e) {
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  const email = document.getElementById('email').value.trim();
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const r = await fetch('/api/auth/magic-link', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await r.json();
    if (r.ok) {
      location.href = '/verify-pending?email=' + encodeURIComponent(email);
    } else {
      showAlert('error', data.error || 'Algo falló. Inténtalo de nuevo.');
      btn.disabled = false; btn.textContent = 'Enviar enlace de acceso';
    }
  } catch {
    showAlert('error', 'No se pudo enviar. Revisa tu conexión.');
    btn.disabled = false; btn.textContent = 'Enviar enlace de acceso';
  }
  return false;
}
</script>
<script src="/track.js"></script>

<script>
// Mejoras de UX para login.html — autorelleno desde localStorage + auto-envio

(function smartLogin() {
  const SAVED_EMAIL_KEY = 'c101_last_email';

  // 1) Autorellenar email desde localStorage
  const emailInput = document.getElementById('email');
  if (!emailInput) return;

  const savedEmail = (() => {
    try { return localStorage.getItem(SAVED_EMAIL_KEY) || ''; }
    catch { return ''; }
  })();

  // 2) Si hay error en URL ('expired', 'used', etc.) y email guardado, mostrar
  //    UI especial "te mandamos otro enlace en 3s, [cancelar]"
  const sp = new URLSearchParams(location.search);
  const errType = sp.get('error');
  const nextUrl = sp.get('next');

  if (savedEmail) {
    emailInput.value = savedEmail;
    // Cambiar el botón al texto que aclare
    const sendBtn = document.getElementById('sendBtn');
    if (sendBtn) sendBtn.textContent = `Enviar enlace a ${savedEmail}`;

    // Mostrar enlace "cambiar email" debajo del input
    const form = document.getElementById('loginForm');
    if (form && !document.getElementById('changeEmailLink')) {
      const changeLink = document.createElement('a');
      changeLink.id = 'changeEmailLink';
      changeLink.href = '#';
      changeLink.textContent = 'Cambiar email';
      changeLink.style.cssText = 'display:block;font-size:13px;color:var(--muted);text-align:center;margin-top:14px;text-decoration:underline;';
      changeLink.addEventListener('click', (e) => {
        e.preventDefault();
        try { localStorage.removeItem(SAVED_EMAIL_KEY); } catch {}
        emailInput.value = '';
        emailInput.focus();
        if (sendBtn) sendBtn.textContent = 'Enviar enlace de acceso';
        changeLink.remove();
        // Cancelar countdown si existe
        if (window._loginCountdown) {
          clearInterval(window._loginCountdown);
          window._loginCountdown = null;
          const ind = document.getElementById('autoSendIndicator');
          if (ind) ind.remove();
        }
      });
      form.appendChild(changeLink);
    }

    // Auto-envio si NO hay error grave en la URL
    const errorPreventsAutoSend = (errType === 'used' || errType === 'invalid' || errType === 'expired');
    if (!errorPreventsAutoSend) {
      autoSendCountdown(savedEmail);
    }
  }

  // 3) Hook al envío del form para guardar el email
  const form = document.getElementById('loginForm');
  if (form) {
    form.addEventListener('submit', () => {
      const v = (emailInput.value || '').trim().toLowerCase();
      if (v && v.includes('@')) {
        try { localStorage.setItem(SAVED_EMAIL_KEY, v); } catch {}
      }
    });
  }

  // 4) Preservar ?next= en el redirect del magic link
  if (nextUrl) {
    try {
      // Guardar en sessionStorage para que /app/auth/me lo use post-login
      sessionStorage.setItem('c101_post_login_next', nextUrl);
    } catch {}
  }

  function autoSendCountdown(email) {
    // No enviar si ya hay alerts (errores previos)
    const existingAlerts = document.querySelectorAll('#alerts .alert-error');
    if (existingAlerts.length > 0) return;

    let secs = 3;
    const indicator = document.createElement('div');
    indicator.id = 'autoSendIndicator';
    indicator.style.cssText = 'text-align:center;margin:12px 0;padding:12px 16px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink-2);';
    indicator.innerHTML = `Enviando enlace automáticamente en <strong id="autoSendSecs">${secs}</strong>s · <a href="#" id="cancelAutoSend" style="color:var(--accent);text-decoration:underline;">Cancelar</a>`;

    const sendBtn = document.getElementById('sendBtn');
    if (sendBtn && sendBtn.parentNode) sendBtn.parentNode.insertBefore(indicator, sendBtn);

    document.getElementById('cancelAutoSend').addEventListener('click', (e) => {
      e.preventDefault();
      clearInterval(window._loginCountdown);
      window._loginCountdown = null;
      indicator.remove();
    });

    window._loginCountdown = setInterval(() => {
      secs -= 1;
      const secsEl = document.getElementById('autoSendSecs');
      if (secsEl) secsEl.textContent = secs;
      if (secs <= 0) {
        clearInterval(window._loginCountdown);
        window._loginCountdown = null;
        indicator.innerHTML = 'Enviando...';
        // Trigger del submit normal
        if (sendBtn) sendBtn.click();
      }
    }, 1000);
  }
})();

</script>
</body>
