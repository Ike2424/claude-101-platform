<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2-2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #10B981; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #10B981; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #10B981, #10B981dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #10B981, #10B981dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #10B98166;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #10B981;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #10B981; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #10B981; background: ##10B98111; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #10B981, #10B981dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #10B98133;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #10B981; box-shadow: 0 0 0 3px #10B98111; }
        
        button { 
            background: linear-gradient(135deg, #10B981, #10B981dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #10B98144; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##10B98111; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #10B981; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #10B981; background: ##10B98111; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M2 • L2 • Modelos</div>
                <div class="title">Módulo 2 - Lección 2</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Conoce tu espacio de trabajo", "text": "Saber donde esta cada cosa te hace mucho mas rapido y te quita el miedo a 'romper algo'.\n\nLa interfaz de Claude.ai se organiza en pocas zonas claras: el area de conversacion, el cuadro de mensaje, el historial lateral y los ajustes.\n\nEn esta leccion recorremos cada una y los detalles que la mayoria pasa por alto.", "points": 10}, {"type": "content", "title": "El area de conversacion", "text": "Es el centro de la pantalla: aqui aparece el ida y vuelta entre tus mensajes y las respuestas de Claude.\n\n• Se lee de arriba (mas antiguo) a abajo (mas reciente)\n• Cada respuesta puedes copiarla, regenerarla o editar tu mensaje\n• El hilo completo es el 'contexto' que Claude tiene presente\n\nPiensa en ella como una conversacion real que queda escrita.", "points": 10}, {"type": "content", "title": "El cuadro de mensaje", "text": "Donde escribes, abajo del todo. Es tu punto de entrada para TODO:\n\n• Escribes tu prompt y envias con Enter\n• Shift+Enter hace salto de linea sin enviar (util para prompts largos)\n• Puedes adjuntar imagenes y archivos\n• Puedes pegar texto largo para que Claude lo analice\n\nDominar este cuadro es dominar el 90% del uso diario.", "points": 10}, {"type": "content", "title": "Adjuntar archivos e imagenes", "text": "Claude no solo lee texto que escribes: puede trabajar con lo que subes.\n\n• Imagenes: capturas, fotos, graficos, diagramas\n• Documentos: PDF, texto, hojas de datos\n• Varios a la vez para compararlos\n\nEj: sube una foto de una factura y pide 'extrae el total y la fecha'. Lo veras a fondo en los modulos de capacidades y casos de uso.", "points": 10}, {"type": "content", "title": "Los Artifacts", "text": "Cuando Claude crea algo sustancial (un documento, codigo, una pagina), suele abrirlo en un panel aparte llamado Artifact.\n\n• No se mezcla con el hilo de chat\n• Puedes leerlo, editarlo y descargarlo\n• Puedes pedir cambios sin reescribir todo\n\nEs la diferencia entre 'una respuesta' y 'un entregable'. Dedicamos una leccion entera a esto en M5.", "points": 10}, {"type": "content", "title": "El historial lateral", "text": "Cada conversacion se guarda automaticamente en una lista a un lado.\n\n• Puedes volver a cualquier chat anterior\n• Renombralos para encontrarlos rapido ('Campana junio', 'Bug login')\n• Borra los que ya no necesites\n\nUn historial ordenado es como un escritorio limpio: encuentras todo y trabajas mejor.", "points": 10}, {"type": "content", "title": "Empezar un chat nuevo (cuando y por que)", "text": "El boton de 'nuevo chat' hace mas de lo que parece: empieza con contexto LIMPIO.\n\nAbre uno nuevo cuando:\n• Cambias de tema por completo\n• El hilo se volvio muy largo y confuso\n• Quieres evitar que ideas viejas 'contaminen' la respuesta\n\nQuédate en el mismo hilo cuando sigues con el mismo tema y quieres que recuerde lo anterior.", "points": 10}, {"type": "content", "title": "Seleccionar modelo y opciones", "text": "Segun tu plan, la interfaz te deja elegir el modelo (Haiku/Sonnet/Opus) y activar funciones como busqueda web.\n\n• El selector suele estar cerca del cuadro de mensaje\n• Cambiar de modelo afecta velocidad, capacidad y costo (recuerda M1-L2)\n\nNo tengas miedo de experimentar: cambiar opciones no rompe nada.", "points": 10}, {"type": "example", "title": "Tu primera sesion ordenada", "code": "1. Abre un chat nuevo\n2. Renombralo segun el tema: 'Plan de contenidos'\n3. Adjunta el documento de referencia\n4. Escribe tu peticion (Shift+Enter para varias lineas)\n5. Si crea un documento, editalo en el Artifact\n6. Tema distinto -> chat nuevo", "points": 15}, {"type": "interactive_quiz", "title": "Donde se analiza un archivo que subes?", "question": "Subes un PDF para que lo resuma. Donde interactuas principalmente?", "options": [{"text": "En el cuadro de mensaje lo adjuntas y conversas sobre el", "correct": true, "reason": "Correcto: adjuntas en el cuadro de mensaje y trabajas en la conversacion.", "points": 20}, {"text": "En los ajustes de la cuenta", "correct": false, "reason": "Los ajustes no procesan archivos.", "points": 0}, {"text": "No se puede subir archivos", "correct": false, "reason": "Si se pueden adjuntar archivos e imagenes.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "Cuando conviene un chat nuevo?", "question": "Cual es el mejor momento para empezar conversacion nueva?", "options": [{"text": "Cuando cambias por completo de tema", "correct": true, "reason": "Correcto: contexto limpio evita que ideas viejas interfieran.", "points": 20}, {"text": "Cuando quieres que recuerde lo anterior", "correct": false, "reason": "Para eso te quedas en el mismo hilo.", "points": 0}, {"text": "Nunca, todo en un solo chat", "correct": false, "reason": "Un mega-hilo se vuelve confuso y pierde foco.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: atajo util", "instruction": "Que tecla combinas con Enter para hacer un salto de linea sin enviar? (una palabra)", "answer": "Shift", "hint": "Shift+Enter inserta salto de linea sin enviar el mensaje.", "points": 25}, {"type": "matching_game", "title": "Zonas de la interfaz", "pairs": [{"left": "Conversacion", "right": "Mensajes y respuestas", "points": 15}, {"left": "Cuadro de mensaje", "right": "Escribir y adjuntar", "points": 15}, {"left": "Artifact", "right": "Documento en panel aparte", "points": 15}, {"left": "Historial", "right": "Chats guardados", "points": 15}, {"left": "Chat nuevo", "right": "Contexto limpio", "points": 15}]}, {"type": "content", "title": "Resumen de la leccion", "text": "• El area de conversacion es el hilo (y el contexto) de Claude\n• El cuadro de mensaje: escribir, adjuntar, Shift+Enter\n• Los Artifacts abren entregables editables en panel aparte\n• El historial guarda y organiza tus chats\n• Nuevo chat = contexto limpio para temas distintos\n\nCon el mapa claro, en la siguiente leccion organizamos el trabajo con conversaciones, proyectos y estilos.", "points": 10}, {"type": "badge", "name": "🧭 Guia de la Interfaz", "description": "Te mueves con soltura por toda la interfaz de Claude."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m2l2') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m2l2', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 2 - Lección 2</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #10B98144';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
