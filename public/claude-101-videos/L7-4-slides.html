<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L7-4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #DC2626; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #DC2626; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #DC2626, #DC2626dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #DC2626, #DC2626dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #DC262666;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #DC2626;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #DC2626; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #DC2626; background: ##DC262611; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #DC2626, #DC2626dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #DC262633;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #DC2626; box-shadow: 0 0 0 3px #DC262611; }
        
        button { 
            background: linear-gradient(135deg, #DC2626, #DC2626dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #DC262644; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##DC262611; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #DC2626; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #DC2626; background: ##DC262611; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M7 • L4 • Buenas practicas</div>
                <div class="title">Módulo 7 - Lección 4</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/15</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Tu eres responsable del resultado", "text": "Claude es una herramienta; las decisiones y publicaciones son tuyas.\n\nUsa la IA para amplificar tu trabajo, no para evadir responsabilidad sobre lo que generas y compartes.", "points": 10}, {"type": "content", "title": "Transparencia", "text": "• Indica cuando un contenido fue asistido por IA si el contexto lo requiere\n• No atribuyas a personas reales frases que no dijeron\n• Respeta derechos de autor y fuentes", "points": 10}, {"type": "content", "title": "Evita usos daninos", "text": "No uses la IA para:\n• Enganar, suplantar o manipular\n• Generar desinformacion\n• Acosar o discriminar\n\nEl uso responsable protege a otros y a tu propia reputacion.", "points": 10}, {"type": "content", "title": "Sesgos y equidad", "text": "Los modelos pueden reflejar sesgos de sus datos.\n\n• Revisa resultados sensibles (contratacion, evaluaciones)\n• Pide multiples perspectivas\n• No delegues decisiones que afectan a personas sin supervision humana", "points": 10}, {"type": "interactive_quiz", "title": "Quien es responsable del contenido generado?", "question": "Si publicas un texto hecho con ayuda de Claude y tiene un error grave, quien responde?", "options": [{"text": "Claude", "correct": false, "reason": "La herramienta no asume tu responsabilidad.", "points": 0}, {"text": "Tu, que lo revisas y publicas", "correct": true, "reason": "Correcto: la responsabilidad final del uso es tuya.", "points": 20}, {"text": "Nadie", "correct": false, "reason": "Siempre hay un responsable: quien publica.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: principio etico", "instruction": "Atribuir a una persona real una frase que no dijo viola que principio? (una palabra que empieza por T)", "answer": "transparencia", "hint": "Falta de transparencia/honestidad: no inventar citas de personas reales.", "points": 25}, {"type": "matching_game", "title": "Uso responsable", "pairs": [{"left": "Responsabilidad", "right": "Es del usuario", "points": 15}, {"left": "Transparencia", "right": "Indicar uso de IA", "points": 15}, {"left": "Evitar", "right": "Desinformacion", "points": 15}, {"left": "Sesgos", "right": "Supervisar y revisar", "points": 15}]}, {"type": "content", "title": "Propiedad intelectual y citas", "text": "Respeta el trabajo ajeno:\n\n• No publiques como tuyo texto que no revisaste ni adaptaste\n• No atribuyas a personas reales frases inventadas\n• Cita fuentes cuando uses datos o ideas de otros\n\nLa IA facilita generar; tu responsabilidad es publicar de forma honesta.", "points": 10}, {"type": "content", "title": "Sesgos: revisa lo sensible", "text": "Los modelos pueden reflejar sesgos de sus datos de entrenamiento.\n\nTen especial cuidado en decisiones sobre personas:\n• Contratacion, evaluaciones, prestamos\n• Cualquier juicio que afecte a alguien\n\nPide varias perspectivas y no delegues estas decisiones sin supervision humana.", "points": 10}, {"type": "content", "title": "Transparencia con tu audiencia", "text": "Segun el contexto, conviene indicar cuando un contenido fue asistido por IA.\n\n• En trabajo academico o periodistico, suele ser obligado\n• Con clientes, genera confianza ser honesto\n\nLa transparencia no resta valor a tu trabajo: lo hace mas creible.", "points": 10}, {"type": "example", "title": "Pedir una revision de sesgos", "code": "Revisa este anuncio de empleo y senala cualquier lenguaje\nque pueda excluir o sesgar a algun grupo (genero, edad,\norigen). Sugiere alternativas neutras.\n\nTexto: <<< ...oferta de empleo... >>>", "points": 15}, {"type": "interactive_quiz", "title": "Quien es responsable del contenido generado?", "question": "Publicas algo hecho con Claude y tiene un error grave. Quien responde?", "options": [{"text": "Claude", "correct": false, "reason": "La herramienta no asume tu responsabilidad.", "points": 0}, {"text": "Tu, que lo revisas y publicas", "correct": true, "reason": "Correcto: la responsabilidad final del uso es tuya.", "points": 20}, {"text": "Nadie", "correct": false, "reason": "Siempre responde quien publica.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen del modulo 7", "text": "Ya usas Claude con criterio:\n• Privacidad y datos sensibles\n• Verificacion y pensamiento critico\n• Limitaciones y como rodearlas\n• Uso responsable y etico\n\nEn el modulo 8 damos el salto al siguiente nivel: Claude Code, MCP y un proyecto final.", "points": 10}, {"type": "badge", "name": "⚖️ Usuario Responsable", "description": "Aplicas etica, transparencia y supervision humana al usar IA."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m7l4') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m7l4', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 7 - Lección 4</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #DC262644';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
