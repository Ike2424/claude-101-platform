>verificas</em>?", "list": [{"text": "Claude te dice \"el 23.7% de las empresas españolas usaron IA en 2024\".", "options": ["Lo uso", "Verifico el dato — cifra precisa para decisión = bandera roja", "Lo redondeo"], "correct": 1, "feedback": "Verifica. Cifra precisa con dos decimales sobre un dato muy específico = casi seguro que necesita verificación."}, {"text": "Claude reformula un párrafo tuyo con mejor estructura.", "options": ["Lo verifico palabra a palabra", "Lo leo y decido si me convence", "Lo acepto sin más"], "correct": 1, "feedback": "Decisión editorial, no factual. No hay \"verdad\" que verificar — tu criterio decide si la versión nueva es mejor."}, {"text": "Claude cita \"un estudio reciente del MIT sobre productividad con IA\".", "options": ["Lo cito", "Le pido nombre exacto del estudio y autor, lo busco", "Confío"], "correct": 1, "feedback": "Pide referencia concreta y búscala. Citas vagas son una bandera roja típica."}]}, {"type": "recap", "list": [{"q": "¿Por qué verificar incluso si Claude suena seguro?", "options": ["Porque siempre miente", "Porque tono ≠ precisión — puede sonar seguro y estar equivocado", "Por costumbre"], "correct": 1, "explain": "Tono y precisión están desacopladas. Verifica el contenido, no el cómo lo dice."}, {"q": "¿En qué casos NO hace falta verificar tan rigurosamente?", "options": ["En cifras", "Reformulaciones, ideas, opiniones, análisis cualitativos", "Nunca verifiques"], "correct": 1, "explain": "Cosas no factuales se evalúan por criterio, no por verificación. Confías en tu juicio."}]}, {"type": "final", "title": "Usuario <em>crítico</em>", "subtitle": "Verificar lo que toca, confiar en lo demás. En la siguiente: las limitaciones que debes conocer.", "ctaLabel": "Marcar lección 7.2 completada →"}]};
