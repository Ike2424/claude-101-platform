dido poco."}]}, {"type": "final", "title": "Has terminado el <em>bonus</em>", "subtitle": "Constitutional AI, markdown, Skills, agentes y MCP. Tienes las piezas para construir con Claude, no solo usarlo. Lo siguiente es práctica — elige una tarea, construye algo pequeño, itera.", "ctaLabel": "Marcar M9 como completado →"}]};
