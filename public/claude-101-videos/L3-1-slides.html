window.MODULE_DATA = {"module": 3, "lessonId": "l3-1", "lessonNumber": "3.1", "title": "Anatomía de un buen prompt", "slides": [{"type": "intro", "title": "Tu <em>punto de partida</em>", "subtitle": "Cómo prompts a Claude HOY.", "chips": ["Frase corta y a ver qué sale", "Doy contexto a veces", "Sigo plantillas", "Improviso siempre", "Aún no tengo método"]}, {"type": "choice", "eyebrow": "Pregunta 1", "title": "Las <em>cuatro partes</em>", "prompt": "¿Cuáles son los componentes mínimos útiles de un buen prompt?", "options": ["Saludo + pregunta + agradecimiento + despedida", "Modelo + temperatura + tokens + sistema", "Tarea + contexto + formato + restricciones", "Datos + análisis + conclusión + acción"], "correct": 2, "feedback": "Tarea + contexto + formato + restricciones. Qué quieres, qué debe saber Claude, cómo entregarlo, qué evitar. Cubre esto y reduces el 80% de respuestas \"no es lo que quería\"."}, {"type": "reveal", "title": "Los <em>cuatro</em> componentes", "prompt": "Toca cada uno. Hay que abrir los cuatro.", "items": [{"icon": "🎯", "name": "Tarea", "tag": "Qué", "body": "Verbo en imperativo + objeto. \"Resume este informe\", \"Reescribe el email\", \"Analiza estos datos\". No preguntas vagas como \"¿qué te parece?\"."}, {"icon": "🗺️", "name": "Contexto", "tag": "Por qué", "body": "Quién es el destinatario, qué pasó antes, qué se sabe. Una línea de contexto cambia drásticamente la respuesta."}, {"icon": "📐", "name": "Formato", "tag": "Cómo", "body": "Lista, párrafo, tabla, código. Longitud. Tono. Si lo dejas a su criterio, decidirá Claude — y a veces no encaja."}, {"icon": "🚫", "name": "Restricciones", "tag": "Qué evitar", "body": "Sin jerga, sin emojis, evitar X tema, máximo Y palabras. Lo que NO quieres es tan importante como lo que sí."}], "feedbackHead": "Listo.", "feedback": "Tarea + contexto + formato + restricciones. Si los cuatro están en el prompt, la calidad del output da un salto."}, {"type": "tf", "title": "Sobre <em>longitud</em>", "statement": "\"Cuanto más largo el prompt, mejor la respuesta.\"", "correct": false, "feedback": "Falso. Largo no = bueno. Lo que importa es claridad y especificidad. Un prompt de 3 líneas bien estructurado vale más que uno de 30 caótico."}, {"type": "scenarios", "title": "Identifica el <em>componente</em> que falta", "list": [{"text": "\"Escríbeme un email.\"", "options": ["Falta la tarea", "Faltan tarea concreta, contexto y formato — todo en realidad", "Está bien"], "correct": 1, "feedback": "Falta todo. ¿A quién? ¿para qué? ¿qué tono? ¿qué longitud? Sin esos elementos Claude inventa contexto."}, {"text": "\"Como CMO de una pyme de Granada que vende sostenibilidad, redacta un email a clientes inactivos para reactivar relación.\"", "options": ["Falta el formato", "Está completo: rol + tarea + audiencia + objetivo", "Falta restricción"], "correct": 1, "feedback": "Muy bien construido. Solo se le podría añadir longitud máxima o restricciones de tono — pero está completo."}, {"text": "\"Resume este PDF en bullets, max 5 ideas, tono neutro, sin emojis.\"", "options": ["Falta el contexto", "Le falta el \"para quién\"", "Está perfecto"], "correct": 1, "feedback": "Le falta el destinatario. ¿Resumen para mi CEO? ¿para un cliente? ¿para mí mismo? Cambia mucho el resumen final."}]}, {"type": "recap", "list": [{"q": "¿Qué cambias antes en un prompt que falla?", "options": ["El modelo", "La temperatura", "Contexto y claridad — son el 90% de los fallos"], "correct": 2, "explain": "Pocas veces es el modelo. Casi siempre es que no le diste el contexto que necesitaba."}, {"q": "¿Por qué incluir restricciones explícitas?", "options": ["Por educación", "Para que Claude no añada cosas que no quieres (emojis, jerga, etc.)", "Para alargar el prompt"], "correct": 1, "explain": "Lo que no quieres es tan importante como lo que sí. Restricciones te ahorran iteraciones."}]}, {"type": "final", "title": "Estructura, no <em>azar</em>", "subtitle": "Tarea, contexto, formato, restricciones. Cuatro piezas
