<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3-1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #A855F7; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #A855F7; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #A855F7, #A855F7dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #A855F766;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #A855F7;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #A855F7; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #A855F7; background: ##A855F711; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #A855F733;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #A855F7; box-shadow: 0 0 0 3px #A855F711; }
        
        button { 
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #A855F744; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##A855F711; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #A855F7; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #A855F7; background: ##A855F711; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M3 • L1 • Prompting</div>
                <div class="title">Módulo 3 - Lección 1</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/18</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "El prompt es el volante", "text": "Un prompt es la instruccion que le das a Claude. Es, literalmente, el volante: la calidad de tu resultado depende casi por completo de como lo escribas.\n\nLa buena noticia: escribir buenos prompts no es magia ni programacion. Es una habilidad con reglas claras que cualquiera puede aprender.\n\nEste modulo entero va de eso. Y empieza por la anatomia: las partes de las que se compone un buen prompt.", "points": 10}, {"type": "content", "title": "Las 4 partes de un buen prompt", "text": "Un prompt solido casi siempre tiene estos cuatro ingredientes:\n\n1. Rol o contexto\n• Quien debe 'ser' Claude y para quien escribe\n\n2. Tarea explicita\n• Que quieres exactamente, en un verbo claro\n\n3. Contexto y datos\n• El material sobre el que trabaja\n\n4. Formato de salida\n• Como quieres la respuesta\n\nNo siempre necesitas los cuatro, pero cuantos mas incluyas, mejor el resultado.", "points": 10}, {"type": "content", "title": "Ingrediente 1: el rol", "text": "Decirle a Claude QUIEN debe ser orienta todo: vocabulario, profundidad y enfoque.\n\n• 'Eres un editor experto en textos legales'\n• 'Eres un profesor de primaria paciente'\n• 'Eres un revisor de codigo senior'\n\nEl mismo encargo cambia por completo segun el rol. Es la forma mas rapida de subir la calidad sin escribir mucho mas.", "points": 10}, {"type": "content", "title": "Ingrediente 2: la tarea", "text": "La tarea es el verbo: que quieres que HAGA, sin ambiguedad.\n\nVerbos claros: resume, reescribe, clasifica, compara, traduce, genera, corrige.\n\n❌ 'Mira esto' (no es una tarea)\n✅ 'Resume esto en 3 puntos'\n\nUna tarea principal por prompt. Si necesitas varias, encadenalas en mensajes separados.", "points": 10}, {"type": "content", "title": "Ingrediente 3: el contexto", "text": "El contexto es todo lo que Claude necesita saber pero no puede adivinar:\n\n• El material a procesar (texto, datos)\n• La audiencia ('para directivos sin perfil tecnico')\n• El objetivo real detras de la tarea\n• Las restricciones ('sin tecnicismos', 'tono formal')\n\nRegla mental: si un humano nuevo no podria hacer la tarea solo con tu texto, a Claude tambien le falta informacion.", "points": 10}, {"type": "content", "title": "Ingrediente 4: el formato", "text": "Si no dices COMO quieres la respuesta, recibes texto libre dificil de reutilizar.\n\nEspecifica el entregable:\n• 'Lista de 5 vinetas, una frase cada una'\n• 'Tabla con columnas X, Y, Z'\n• 'JSON con estas claves'\n• 'Maximo 100 palabras'\n\nEl formato convierte una respuesta en algo listo para usar.", "points": 10}, {"type": "content", "title": "Por que funciona la estructura", "text": "Claude no adivina tu intencion: responde a lo que escribes.\n\n• Prompt vago -> respuesta vaga\n• Prompt estructurado -> resultado util y repetible\n\nCada parte que anades es una decision que Claude YA no tiene que adivinar. Y menos adivinanza significa resultados mas cercanos a lo que tenias en la cabeza.", "points": 10}, {"type": "content", "title": "De lo generico a lo especifico", "text": "Comparacion directa:\n\nGenerico\n• 'Escribeme algo sobre productividad'\n• Resultado: texto plano, impredecible\n\nEspecifico\n• 'Escribe 5 consejos de productividad para trabajadores remotos con hijos, tono empatico, una frase cada uno'\n• Resultado: util y listo para usar\n\nMismo tema, mundos de diferencia.", "points": 10}, {"type": "content", "title": "Trucos que elevan cualquier prompt", "text": "• Pon las instrucciones al principio y el material despues\n• Usa delimitadores (comillas triples, ###, etiquetas) para separar el texto a procesar\n• Pide un solo entregable por prompt\n• Si la tarea es compleja, pide que piense paso a paso (M4)\n• Da un ejemplo del resultado ideal cuando puedas\n\nPequenos habitos que, juntos, marcan una gran diferencia.", "points": 10}, {"type": "example", "title": "Plantilla reutilizable (los 4 ingredientes)", "code": "Rol: Eres un asistente de marketing B2B.\n\nTarea: Escribe 3 asuntos de email para una campana de reactivacion.\n\nContexto:\n- Producto: software de facturacion para pymes\n- Audiencia: clientes inactivos hace 90 dias\n- Tono: cercano, sin sonar desesperado\n\nFormato: lista numerada, max 8 palabras cada asunto.", "points": 15}, {"type": "example", "title": "El mismo prompt, version pobre vs pro", "code": "# Pobre\nHazme un email de ventas.\n\n# Pro\nRol: vendedor consultivo, no agresivo.\nTarea: escribe un email de primer contacto.\nContexto: vendo software de agendas a clinicas dentales;\nel destinatario es el gerente; no me conoce.\nFormato: max 90 palabras, con asunto, una sola llamada a la accion.", "points": 15}, {"type": "interactive_quiz", "title": "Detecta el ingrediente que falta", "question": "'Reescribe este parrafo para que sea mas claro.' Que le falta para ser excelente?", "options": [{"text": "Esta perfecto asi", "correct": false, "reason": "Le falta contexto: para quien, que tono, que longitud.", "points": 0}, {"text": "El formato/tono y la audiencia", "correct": true, "reason": "Correcto: definir audiencia y formato hace la salida util y predecible.", "points": 20}, {"text": "Decir que use IA", "correct": false, "reason": "Eso es irrelevante; el modelo ya es la IA.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "Cual es el rol en este prompt?", "question": "'Eres un chef. Crea un menu de 3 platos.' Que parte es 'Eres un chef'?", "options": [{"text": "La tarea", "correct": false, "reason": "La tarea es 'crea un menu'.", "points": 0}, {"text": "El rol", "correct": true, "reason": "Correcto: define quien debe ser Claude.", "points": 20}, {"text": "El formato", "correct": false, "reason": "El formato seria como presentar el menu.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: cuenta los ingredientes", "instruction": "Cuantos de los 4 ingredientes tiene: 'Eres un nutricionista. Crea un menu semanal vegetariano de 1800 kcal en formato tabla'?", "answer": "4", "hint": "Rol (nutricionista), tarea (crear menu), contexto (vegetariano, 1800 kcal) y formato (tabla).", "points": 25}, {"type": "matching_game", "title": "Conecta concepto y definicion", "pairs": [{"left": "Rol", "right": "Quien debe ser Claude", "points": 15}, {"left": "Tarea", "right": "El verbo de lo que pides", "points": 15}, {"left": "Contexto", "right": "Datos y restricciones", "points": 15}, {"left": "Formato", "right": "Como quieres la respuesta", "points": 15}, {"left": "Delimitadores", "right": "Separan instruccion de material", "points": 15}]}, {"type": "content", "title": "Resumen de la leccion", "text": "• Un buen prompt = rol + tarea + contexto + formato\n• El rol orienta, la tarea concreta, el contexto informa, el formato hace util\n• Especifico siempre gana a generico\n• Antes de enviar: que doy por sentado que Claude no sabe?\n\nEn la siguiente leccion profundizamos en el ingrediente que mas mueve la aguja: el contexto.", "points": 10}, {"type": "badge", "name": "🎯 Arquitecto de Prompts", "description": "Dominas la anatomia de un buen prompt: rol, tarea, contexto y formato."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m3l1') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m3l1', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 3 - Lección 1</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #A855F744';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
