ype": "scenarios", "title": "Mejora estos <em>prompts</em>", "list": [{"text": "\"Hazme un post para LinkedIn.\"", "options": ["Está bien", "Le falta tema, audiencia, objetivo, tono y longitud", "Solo falta el tema"], "correct": 1, "feedback": "Le falta TODO. Tema concreto, para quién, qué objetivo (engagement vs autoridad), tono, longitud. Con eso el post pasa de genérico a útil."}, {"text": "\"Escribe email a cliente que pidió descuento que no podemos dar, sin perder la relación, tono cercano profesional, máximo 100 palabras.\"", "options": ["Demasiado largo", "Excelente: rol implícito, situación, restricción, longitud", "Falta el formato"], "correct": 1, "feedback": "Muy bien. Tienes el contexto, la barrera, el objetivo y las restricciones. Claude tiene todo lo necesario."}, {"text": "\"Resume este informe.\"", "options": ["Bien", "Falta para quién y qué objetivo del resumen", "Falta el modelo"], "correct": 1, "feedback": "\"Para mi CEO con foco en cifras\" ≠ \"para mis equipos con foco operativo\". El destinatario y objetivo cambian el resumen."}]}, {"type": "recap", "list": [{"q": "Para que Claude escriba bien algo profesional:", "options": ["Cambiar a Opus", "Contexto del lector + objetivo + ejemplos tuyos del tono", "Pedirle \"profesional\""], "correct": 1, "explain": "Contexto + ejemplos. Es lo que separa una respuesta genérica de una útil."}, {"q": "Para emails delicados:", "options": ["Pedírselo directo", "Darle relación previa + lo que pasó + qué quieres conseguir", "Solo el destinatario"], "correct": 1, "explain": "Contexto humano = email humano. Sin saber la relación, Claude escribe genérico."}]}, {"type": "final", "title": "Tu <em>copy</em> con turbo", "subtitle": "Emails, posts, resúmenes — con buen prompt, vuelves a ser eficiente. En la siguiente: programación y análisis técnico.", "ctaLabel": "Marcar lección 6.1 completada →"}]};
