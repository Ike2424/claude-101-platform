n un escalón."}, {"type": "tf", "title": "Sobre la <em>primera respuesta</em>", "statement": "\"Si la primera respuesta no es la que querías, casi siempre es porque el prompt original era ambiguo, no porque Claude se haya equivocado.\"", "correct": true, "feedback": "Verdadero. El 80% de \"respuestas malas\" vienen de prompts ambiguos. Cuando iteras añadiendo lo que falta, suele clavarlo en el segundo intento."}, {"type": "scenarios", "title": "Iteración <em>productiva</em>", "list": [{"text": "\"El email me ha salido demasiado formal.\"", "options": ["\"Hazlo distinto\"", "\"Reescríbelo con tono más cercano, llámale por su nombre, evita \"estimado\", máximo 100 palabras\"", "\"Cambiar de modelo\""], "correct": 1, "feedback": "Feedback específico = ajuste preciso. Le dices exactamente qué cambia y qué se mantiene."}, {"text": "\"Me gustan 2 de los 5 puntos del resumen — los otros no.\"", "options": ["\"Hazlo otra vez\"", "\"Mantén el punto 1 y 3 tal cual. Reemplaza los otros tres por algo más concreto sobre [tema específico]\"", "Aceptarlo"], "correct": 1, "feedback": "Anclaje + cambio. Mantienes lo bueno, reemplazas lo flojo. Iteración productiva."}, {"text": "\"El código funciona pero no me gusta el estilo.\"", "options": ["\"Hazlo más bonito\"", "\"Refactoriza para que sea más legible: nombres descriptivos, funciones < 20 líneas, type hints. Manténlo funcional.\"", "Aceptar"], "correct": 1, "feedback": "Criterios concretos. \"Legible\" significa cosas distintas — defines qué quieres ver."}]}, {"type": "recap", "list": [{"q": "¿Cuándo merece la pena empezar prompt de cero?", "options": ["Casi siempre", "Cuando el prompt original tiene un error de base — rol, audiencia o tarea mal definidos", "Nunca"], "correct": 1, "explain": "Si la dirección base está mal, iterar pequeño no arregla. Mejor reescribir el prompt con la dirección correcta."}, {"q": "Tu mejor herramienta para iterar es...", "options": ["Cambiar de modelo", "Decir qué te gustó + qué cambiar específicam
