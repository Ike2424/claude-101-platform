<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3-3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #A855F7; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #A855F7; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #A855F7, #A855F7dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #A855F766;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #A855F7;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #A855F7; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #A855F7; background: ##A855F711; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #A855F733;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #A855F7; box-shadow: 0 0 0 3px #A855F711; }
        
        button { 
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #A855F744; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##A855F711; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #A855F7; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #A855F7; background: ##A855F711; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M3 • L3 • Prompting</div>
                <div class="title">Módulo 3 - Lección 3</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Por que comparar antes y despues", "text": "La forma mas rapida de aprender prompting es ver el mismo objetivo escrito mal y bien.\n\nEn esta leccion repasamos casos reales de tareas cotidianas y veras como pequenos cambios disparan la calidad.", "points": 10}, {"type": "content", "title": "Caso 1: Email de trabajo", "text": "ANTES\n• \"Escribe un email pidiendo el reporte\"\n\nDESPUES\n• \"Escribe un email a mi companero Luis pidiendo el reporte de ventas de mayo. Lo necesito antes del viernes. Tono amable pero claro, max 80 palabras, con asunto.\"\n\nEl segundo da algo listo para enviar; el primero, un borrador generico.", "points": 10}, {"type": "content", "title": "Caso 2: Resumen de documento", "text": "ANTES\n• \"Resume esto\" + pegas 10 paginas\n\nDESPUES\n• \"Resume el siguiente informe en 5 puntos clave para un directivo. Destaca riesgos y decisiones pendientes. Texto: <<< ... >>>\"\n\nDefinir audiencia (directivo) y foco (riesgos/decisiones) cambia por completo el resumen.", "points": 10}, {"type": "content", "title": "Caso 3: Ayuda con codigo", "text": "ANTES\n• \"Mi codigo no funciona, ayuda\"\n\nDESPUES\n• \"Esta funcion en Python deberia devolver la suma de pares pero da error. Pega el codigo + el mensaje de error. Explica la causa y dame la version corregida.\"\n\nIncluir codigo, error esperado y error real permite un diagnostico preciso.", "points": 10}, {"type": "example", "title": "Plantilla 'antes/despues' para reutilizar", "code": "Objetivo: <que quieres lograr>\nAudiencia: <para quien>\nMaterial: <<<\n  pega aqui el texto/datos\n>>>\nRestricciones: <longitud, tono, idioma>\nEntregable: <formato exacto del resultado>", "points": 15}, {"type": "interactive_quiz", "title": "Que cambio mejora mas el prompt?", "question": "Tienes: \"Dame ideas de marketing\". Que anadido sube mas la calidad?", "options": [{"text": "Anadir 'por favor'", "correct": false, "reason": "La cortesia no aporta informacion util.", "points": 0}, {"text": "Definir producto, audiencia y canal", "correct": true, "reason": "Correcto: el contexto del negocio enfoca las ideas.", "points": 20}, {"text": "Pedir que sea creativo", "correct": false, "reason": "Demasiado vago; no orienta el resultado.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: identifica el fallo", "instruction": "En el prompt \"traduce esto\" (sin nada mas), cual es el dato critico que falta? (una palabra)", "answer": "idioma", "hint": "Sin el idioma destino, Claude tiene que adivinar a que lengua traducir.", "points": 25}, {"type": "matching_game", "title": "Empareja problema y arreglo", "pairs": [{"left": "Respuesta muy larga", "right": "Fijar longitud", "points": 15}, {"left": "Tono equivocado", "right": "Especificar tono", "points": 15}, {"left": "Se inventa datos", "right": "Dar el material fuente", "points": 15}, {"left": "Formato inutil", "right": "Pedir tabla/lista", "points": 15}]}, {"type": "content", "title": "Caso 4: Generar ideas", "text": "ANTES\n• 'Dame ideas de marketing'\n\nDESPUES\n• 'Dame 10 ideas de marketing de bajo presupuesto para una cafeteria local que quiere atraer publico joven entre semana. Una linea cada una.'\n\nDefinir presupuesto, negocio, publico y momento convierte ideas genericas en ideas accionables.", "points": 10}, {"type": "content", "title": "Caso 5: Aprender un tema", "text": "ANTES\n• 'Explicame las hipotecas'\n\nDESPUES\n• 'Explicame como funciona una hipoteca a alguien que compra su primera casa, sin jerga financiera, con un ejemplo numerico simple.'\n\nLa audiencia ('primera casa', 'sin jerga') y el ejemplo cambian totalmente la utilidad.", "points": 10}, {"type": "content", "title": "El patron comun de todos los casos", "text": "Fijate que en cada 'despues' anadimos lo mismo:\n\n• Para QUIEN es (audiencia)\n• Con que FOCO (que destacar)\n• En que FORMATO (longitud, estructura)\n• Con que TONO\n\nMemoriza ese patron: audiencia + foco + formato + tono. Es tu receta para mejorar casi cualquier prompt.", "points": 10}, {"type": "example", "title": "Plantilla universal antes/despues", "code": "Objetivo: <que quieres lograr>\nAudiencia: <para quien>\nMaterial: <<<\n  pega aqui el texto/datos\n>>>\nFoco: <que destacar>\nFormato: <longitud y estructura del resultado>", "points": 15}, {"type": "interactive_quiz", "title": "Cual es el patron para mejorar un prompt?", "question": "Que conjunto de elementos eleva casi cualquier prompt?", "options": [{"text": "Audiencia + foco + formato + tono", "correct": true, "reason": "Correcto: ese es el patron que repetimos en todos los casos.", "points": 20}, {"text": "Mas palabras y cortesia", "correct": false, "reason": "El relleno no mejora el resultado.", "points": 0}, {"text": "Pedir que sea creativo", "correct": false, "reason": "Demasiado vago; no orienta.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen de la leccion", "text": "• Comparar antes/despues es la forma mas rapida de aprender\n• El salto de calidad viene de anadir audiencia, foco, formato y tono\n• Reutiliza la plantilla universal en tu dia a dia\n\nYa sabes que hacer bien. En la ultima leccion del modulo vemos que NO hacer: los errores comunes.", "points": 10}, {"type": "badge", "name": "🛠️ Refinador de Prompts", "description": "Conviertes prompts genericos en instrucciones que dan resultados listos para usar."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m3l3') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m3l3', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 3 - Lección 3</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #A855F744';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value.trim();
            if (userAnswer.toLowerCase() === answer.toLowerCase()) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
