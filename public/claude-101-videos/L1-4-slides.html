<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1-4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #3B82F6; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #3B82F6; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #3B82F6, #3B82F6dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #3B82F666;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #3B82F6;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #3B82F6; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #3B82F6; background: ##3B82F611; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #3B82F633;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px #3B82F611; }
        
        button { 
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #3B82F644; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##3B82F611; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #3B82F6; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #3B82F6; background: ##3B82F611; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M1 • L4 • Fundamentos</div>
                <div class="title">Módulo 1 - Lección 4</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "No todos los asistentes son iguales", "text": "Por fuera, muchos asistentes de IA se parecen: una caja de texto y respuestas. Pero por dentro se comportan distinto segun como fueron disenados y entrenados.\n\nConocer los rasgos de Claude te ayuda a sacarle partido y a saber cuando es la mejor herramienta para el trabajo.", "points": 10}, {"type": "content", "title": "Rasgo 1: estilo mas natural", "text": "Claude tiende a escribir de forma mas natural y menos formulaica.\n\n• Menos plantillas rigidas y muletillas tipo 'como modelo de lenguaje...'\n• Menos listas roboticas cuando un parrafo va mejor\n• Un tono que suena a redaccion humana cuidada\n\nEsto se nota mucho en escritura, donde el resultado necesita menos 'limpieza' despues.", "points": 10}, {"type": "content", "title": "Rasgo 2: honestidad calibrada", "text": "En lugar de proyectar falsa certeza, Claude tiende a:\n• Reconocer cuando no sabe algo\n• Senalar sus suposiciones\n• Distinguir hecho de opinion\n\nNo es perfecto (sigue pudiendo alucinar), pero su sesgo de diseno es hacia la honestidad, no hacia 'inventar para complacer'.", "points": 10}, {"type": "content", "title": "Rasgo 3: matiz en temas sensibles", "text": "Donde otros asistentes bloquean cualquier tema delicado de golpe, Claude tiende a evaluar si hay dano real y a razonar los grises.\n\n• Menos rechazos automaticos sin sentido\n• Mas disposicion a tratar temas complejos con cuidado\n\nEsto viene de su entrenamiento con principios (Constitutional AI), que veras en el modulo 9 BONUS.", "points": 10}, {"type": "content", "title": "Rasgo 4: excelente en contextos largos", "text": "Claude mantiene la coherencia en documentos extensos: puedes pegar muchas paginas y seguir obteniendo respuestas consistentes.\n\nIdeal para:\n• Analizar informes y contratos completos\n• Resumir libros o transcripciones largas\n• Entender bases de codigo enteras\n\nMantiene el hilo donde otros se pierden.", "points": 10}, {"type": "content", "title": "Rasgo 5: fuerte en razonamiento y codigo", "text": "Claude destaca especialmente en:\n• Razonamiento paso a paso\n• Escritura y reescritura de calidad\n• Generacion y revision de codigo\n\nNo significa que sea el unico bueno en esto, pero son areas donde rinde de forma muy solida en el dia a dia.", "points": 10}, {"type": "content", "title": "Que NO lo hace especial (sé realista)", "text": "Para mantener expectativas sanas, Claude (como todos) tambien:\n• Puede equivocarse con seguridad\n• No conoce eventos posteriores a su entrenamiento\n• No accede a tus datos sin que se los des\n• Varia entre respuestas\n\nLa ventaja no es 'ser infalible', sino el estilo, la honestidad y el manejo de contexto.", "points": 10}, {"type": "content", "title": "Cuando Claude es la mejor opcion", "text": "Brilla especialmente cuando necesitas:\n• Texto de calidad con poco retoque\n• Trabajar con documentos largos\n• Honestidad sobre incertidumbre\n• Tratar temas matizados con cuidado\n\nPara esas tareas, su forma de comportarse marca una diferencia practica real.", "points": 10}, {"type": "example", "title": "Comprobar la honestidad calibrada", "code": "Prueba este prompt para ver el rasgo en accion:\n\n\"Responde solo si estas seguro. Si no lo sabes o no puedes\nverificarlo, dilo claramente en vez de inventar. Para cada dato,\nindica tu nivel de confianza (alto/medio/bajo).\"\n\nVeras como distingue lo que sabe de lo que supone.", "points": 15}, {"type": "interactive_quiz", "title": "Cual es un rasgo distintivo de Claude?", "question": "Cual de estas describe mejor a Claude?", "options": [{"text": "Tiene siempre razon", "correct": false, "reason": "Ningun modelo garantiza exactitud total.", "points": 0}, {"text": "Estilo natural y honestidad sobre lo que no sabe", "correct": true, "reason": "Correcto: redaccion natural y honestidad calibrada lo distinguen.", "points": 20}, {"text": "Nunca necesita contexto", "correct": false, "reason": "Como todos, rinde mejor con buen contexto.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "En que tarea brilla especialmente?", "question": "Cual aprovecha mejor sus fortalezas?", "options": [{"text": "Recordar la noticia de hoy sin buscar", "correct": false, "reason": "No conoce eventos posteriores a su entrenamiento.", "points": 0}, {"text": "Analizar un contrato largo manteniendo coherencia", "correct": true, "reason": "Correcto: los contextos largos son una de sus fortalezas.", "points": 20}, {"text": "Garantizar cero errores en cifras", "correct": false, "reason": "Puede alucinar; los datos hay que verificarlos.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: rasgo distintivo", "instruction": "Claude mantiene coherencia en documentos ___ (una palabra: cortos o largos).", "answer": "largos", "hint": "Destaca en contextos largos manteniendo la coherencia.", "points": 25}, {"type": "matching_game", "title": "Diferencias de Claude", "pairs": [{"left": "Estilo", "right": "Natural, no formulaico", "points": 15}, {"left": "Honestidad", "right": "Reconoce lo que no sabe", "points": 15}, {"left": "Temas sensibles", "right": "Razona matices", "points": 15}, {"left": "Fortaleza", "right": "Contextos largos", "points": 15}, {"left": "Tambien", "right": "Puede equivocarse", "points": 15}]}, {"type": "content", "title": "Resumen del modulo 1", "text": "Completaste los fundamentos:\n• Que es Claude y como accedes a el\n• La familia de modelos y como elegir\n• Como razona por dentro\n• Que lo distingue de otros asistentes\n\nYa tienes la base. En el modulo 2 entramos en lo practico: la interfaz, conversaciones, proyectos y configuracion.", "points": 10}, {"type": "badge", "name": "🆚 Experto Comparativo", "description": "Conoces que distingue a Claude y cuando es la mejor herramienta."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m1l4') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m1l4', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 1 - Lección 4</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #3B82F644';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
