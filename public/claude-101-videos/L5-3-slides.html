<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L5-3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #059669; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #059669; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #059669, #059669dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #059669, #059669dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #05966966;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #059669;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #059669; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #059669; background: ##05966911; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #059669, #059669dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #05966933;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px #05966911; }
        
        button { 
            background: linear-gradient(135deg, #059669, #059669dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #05966944; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##05966911; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #059669; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #059669; background: ##05966911; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M5 • L3 • Herramientas</div>
                <div class="title">Módulo 5 - Lección 3</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Claude como generador de archivos", "text": "Claude puede producir archivos listos para descargar: documentos de texto, hojas de calculo, presentaciones, PDF, codigo y mas.\n\nEn vez de copiar y pegar, recibes el archivo terminado.", "points": 10}, {"type": "content", "title": "Tipos de archivo habituales", "text": "• Documentos: .docx, .md, .txt\n• Datos: .csv, .xlsx\n• Presentaciones: .pptx\n• Documentos finales: .pdf\n• Codigo: .py, .js, .html\n\nPide el formato que necesitas y para que lo usaras.", "points": 10}, {"type": "example", "title": "Pidiendo un archivo concreto", "code": "Crea una hoja de calculo (.xlsx) con un presupuesto mensual.\nColumnas: categoria, presupuesto, gasto real, diferencia.\nIncluye filas de ejemplo y una fila de totales con formula.\nDeja una pestana de 'resumen' con los totales por categoria.", "points": 15}, {"type": "content", "title": "Buenas practicas", "text": "• Indica el formato exacto y la estructura (columnas, secciones)\n• Da datos de ejemplo si quieres ver el resultado\n• Pide validaciones: \"que los totales cuadren\"\n• Revisa el archivo antes de usarlo en produccion", "points": 10}, {"type": "content", "title": "De los datos al entregable", "text": "Puedes encadenar: pegas datos en bruto y pides el archivo final.\n\nEj: \"Con estos datos de ventas, generame un Excel con una tabla y un grafico de barras por mes.\"\n\nAsi conviertes informacion suelta en algo presentable en un paso.", "points": 10}, {"type": "interactive_quiz", "title": "Que formato pedir para datos tabulares?", "question": "Necesitas analizar numeros en columnas y filas. Que formato encaja mejor?", "options": [{"text": ".pptx", "correct": false, "reason": "Es para presentaciones, no para analizar datos.", "points": 0}, {"text": ".xlsx o .csv", "correct": true, "reason": "Correcto: formatos de hoja de calculo para datos tabulares.", "points": 20}, {"text": ".txt", "correct": false, "reason": "Texto plano no estructura bien tablas con formulas.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: extension de Excel", "instruction": "Cual es la extension de archivo de una hoja de calculo de Excel moderna? (incluye el punto)", "answer": ".xlsx", "hint": "Las hojas de Excel modernas usan .xlsx.", "points": 25}, {"type": "matching_game", "title": "Archivo segun necesidad", "pairs": [{"left": "Informe formal", "right": ".docx / .pdf", "points": 15}, {"left": "Datos y formulas", "right": ".xlsx", "points": 15}, {"left": "Diapositivas", "right": ".pptx", "points": 15}, {"left": "Script", "right": ".py / .js", "points": 15}]}, {"type": "content", "title": "Del dato suelto al entregable", "text": "El verdadero valor: pegas informacion en bruto y recibes algo presentable.\n\n• Notas desordenadas -> documento estructurado\n• Numeros pegados -> Excel con tabla y totales\n• Puntos sueltos -> presentacion de diapositivas\n\nTu aportas la materia prima; Claude la convierte en el formato final.", "points": 10}, {"type": "content", "title": "Detalles que mejoran el archivo", "text": "Cuando pidas un archivo, especifica:\n\n• La estructura (columnas, secciones, pestanas)\n• Datos de ejemplo si quieres verlo relleno\n• Reglas: 'que los totales cuadren con formula'\n• Que dejar como [PENDIENTE] para completar tu\n\nCuanto mas claro el molde, menos retoques despues.", "points": 10}, {"type": "content", "title": "Revisa antes de usar", "text": "Un archivo generado es un borrador muy avanzado, no un producto final infalible:\n\n• Verifica numeros y formulas criticas\n• Comprueba que el formato abre bien en tu programa\n• Ajusta lo que no encaje con tu caso\n\nTe ahorra el 90% del trabajo; el 10% de revision sigue siendo tuyo.", "points": 10}, {"type": "example", "title": "Pedir un Excel util", "code": "Crea una hoja de calculo (.xlsx) de presupuesto mensual.\nColumnas: categoria, presupuesto, gasto real, diferencia.\n- Filas de ejemplo para 5 categorias.\n- Fila de totales con formula de suma.\n- Una pestana 'resumen' con el total por categoria.", "points": 15}, {"type": "interactive_quiz", "title": "Que formato pedir para datos tabulares?", "question": "Necesitas analizar numeros en columnas y filas. Que encaja mejor?", "options": [{"text": ".pptx", "correct": false, "reason": "Es para presentaciones, no para analizar datos.", "points": 0}, {"text": ".xlsx o .csv", "correct": true, "reason": "Correcto: formatos de hoja de calculo para datos tabulares.", "points": 20}, {"text": ".txt", "correct": false, "reason": "Texto plano no estructura tablas con formulas.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen de la leccion", "text": "• Claude genera documentos, hojas, presentaciones, PDF y codigo\n• Indica formato y estructura exactos\n• Convierte datos en bruto en entregables presentables\n• Revisa numeros y formato antes de usarlo\n\nSiguiente: como funciona la memoria de Claude entre conversaciones.", "points": 10}, {"type": "badge", "name": "🗂️ Generador de Archivos", "description": "Sabes pedir archivos listos para usar en el formato correcto."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m5l3') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m5l3', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 5 - Lección 3</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #05966944';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
