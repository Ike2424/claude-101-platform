    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "\u00bfQu\u00e9 es Claude?", "text": "Claude es un asistente de IA creado por Anthropic, una empresa de investigaci\u00f3n en seguridad de IA fundada en 2021.\n\nCaracter\u00edsticas principales:\n\u2022 Modelo de lenguaje grande (LLM) entrenado con RLHF\n\u2022 Context window: 200K tokens (equivale a ~150K palabras)\n\u2022 Capacidad de razonamiento avanzada\n\u2022 Generaci\u00f3n de c\u00f3digo de alta calidad\n\u2022 Visi\u00f3n por computadora integrada\n\u2022 Tool use para integraci\u00f3n con sistemas externos\n\nClaudees accesible v\u00eda:\n\u2022 Claude.ai (interfaz web)\n\u2022 API REST (claude.anthropic.com)\n\u2022 SDK (Python, TypeScript)", "points": 10}, {"type": "content", "title": "Historia y Entrenamiento", "text": "Claude ha evolucionado a trav\u00e9s de varias generaciones:\n\n\ud83d\udcc5 Claude 1 (2023)\n\u2022 Primeras iteraciones del modelo\n\u2022 100K tokens de contexto\n\n\ud83d\udcc5 Claude 2 (Agosto 2023)\n\u2022 Mejor razonamiento matem\u00e1tico\n\u2022 Mejor codificaci\u00f3n\n\u2022 100K tokens\n\n\ud83d\udcc5 Claude 3 (Marzo 2024)\n\u2022 Familia de modelos: Opus, Sonnet, Haiku\n\u2022 200K tokens de contexto\n\u2022 Visi\u00f3n integrada\n\n\ud83d\udcc5 Claude 3.5 Sonnet (Junio 2024)\n\u2022 Mejor rendimiento que Opus 3 en muchas tareas\n\u2022 M\u00e1s r\u00e1pido y econ\u00f3mico\n\u2022 Versi\u00f3n actual recomendada", "points": 10}, {"type": "content", "title": "Principios de Dise\u00f1o de Claude", "text": "Anthropic desarroll\u00f3 Claude con estos principios clave:\n\n\ud83d\udee1\ufe0f Seguridad\n\u2022 Entrenamiento con Constitutional AI\n\u2022 Menos propenso a generar contenido nocivo\n\u2022 Rechazo transparente de solicitudes inapropiadas\n\n\ud83d\udcdd Honestidad\n\u2022 Admite cuando no sabe algo\n\u2022 Indica nivel de confianza\n\u2022 No inventa informaci\u00f3n\n\n\ud83e\udd1d Utilidad\n\u2022 Enfoque en tareas pr\u00e1cticas\n\u2022 Razonamiento paso a paso\n\u2022 Explicaciones claras\n\n\ud83c\udfaf Alineaci\u00f3n\n\u2022 Sigue instrucciones bien definidas\n\u2022 Respeta contexto del usuario\n\u2022 Prioriza intenciones del usuario", "points": 10}, {"type": "example", "title": "Tu primer llamada API", "code": "from anthropic import Anthropic\n\n# Inicializar cliente (API key desde env)\nclient = Anthropic()\n\n# Crear mensaje simple\nresponse = client.messages.create(\n    model=\"claude-3-5-sonnet-20241022\",\n    max_tokens=1024,\n    messages=[\n        {\n            \"role\": \"user\",\n            \"content\": \"Expl\u00edcame qu\u00e9 es machine learning en 2 p\u00e1rrafos\"\n        }\n    ]\n)\n\nprint(response.content[0].text)", "points": 15}, {"type": "content", "title": "Modelos Disponibles", "text": "Claude 3 Family (Marzo 2024):\n\n\ud83d\ude80 Claude 3 Opus\n\u2022 Capacidades m\u00e1s avanzadas\n\u2022 Mejor para tareas complejas y razonamiento\n\u2022 Context: 200K tokens\n\u2022 M\u00e1s lento (~60-90 segundos para respuestas largas)\n\u2022 Input: $15/MTok, Output: $75/MTok\n\n\u26a1 Claude 3.5 Sonnet (RECOMENDADO)\n\u2022 Mejor balance velocidad-precisi\u00f3n\n\u2022 Mejor que Opus en muchas tareas\n\u2022 Context: 200K tokens  \n\u2022 Respuesta r\u00e1pida (~5-10 segundos)\n\u2022 Input: $3/MTok, Output: $15/MTok\n\n\ud83d\udca8 Claude 3 Haiku\n\u2022 M\u00e1s r\u00e1pido y econ\u00f3mico\n\u2022 Para tareas simples\n\u2022 Context: 200K tokens\n\u2022 Respuesta muy r\u00e1pida (~1-2 segundos)\n\u2022 Input: $0.80/MTok, Output: $4/MTok", "points": 10}, {"type": "interactive_quiz", "title": "\u00bfCu\u00e1l modelo elegir?", "question": "Necesitas analizar 1000 documentos legales complejos y presupuesto es limitado. \u00bfCu\u00e1l escoges?", "options": [{"text": "Claude 3 Haiku", "correct": false, "reason": "Haiku es econ\u00f3mico pero no tiene capacidad para an\u00e1lisis legales complejos", "points": 0}, {"text": "Claude 3.5 Sonnet", "correct": true, "reason": "\u00a1Correcto! Sonnet es el mejor balance: potencia para an\u00e1lisis complejos + costos razonables (3-15/MTok)", "points": 20}, {"text": "Claude 3 Opus", "correct": false, "reason": "Opus ser\u00eda muy costoso para 1000 documentos (15-75/MTok)", "points": 0}], "points": 20}, {"type": "content", "title": "Contexto y Tokens", "text": "El context window es crucial para trabajar con Claude:\n\n\ud83d\udcca \u00bfQu\u00e9 es un Token?\n\u2022 Unidad b\u00e1sica de texto para Claude\n\u2022 ~4 caracteres = 1 token\n\u2022 Palabras t\u00edpicamente = 1.3 tokens\n\u2022 1000 palabras \u2248 1300 tokens\n\n\ud83d\udd22 Context Window: 200K Tokens\n\u2022 Puedes enviar hasta 200K tokens en la solicitud\n\u2022 Incluye instrucciones + ejemplos + entrada del usuario\n\u2022 M\u00e1ximo output: max_tokens que especifiques (t\u00edpico: 1024-4096)\n\n\ud83d\udca1 Implicaciones Pr\u00e1cticas:\n\u2022 Puedes pasar documentos de 50+ p\u00e1ginas\n\u2022 Puedes incluir c\u00f3digo base completo\n\u2022 Conversaciones largas en un contexto\n\n\u26a0\ufe0f Consideraciones:\n\u2022 M\u00e1s contexto = respuestas m\u00e1s lentas\n\u2022 M\u00e1s contexto = costos m\u00e1s altos\n\u2022 Tokens input cuestan menos que output\n\u2022 Optimiza el contexto para velocidad", "points": 10}, {"type": "content", "title": "Autenticaci\u00f3n y Seguridad", "text": "Configuraci\u00f3n segura de Claude API:\n\n\ud83d\udd10 API Key Management\n\u2022 Obt\u00e9n key en console.anthropic.com\n\u2022 NUNCA la hardcodees\n\u2022 Gu\u00e1rdala en variable de entorno:\n  export ANTHROPIC_API_KEY='sk-ant-...'\n\n\u2022 Revoca keys si se exponen\n\u2022 Rota keys peri\u00f3dicamente en producci\u00f3n\n\n\ud83d\udee1\ufe0f Rate Limits (Tier 1)\n\u2022 600 solicitudes por minuto\n\u2022 Aumenta con uso demostrado\n\u2022 Distribuye solicitudes para evitar throttling\n\n\ud83d\udcb0 Presupuesto\n\u2022 Configura l\u00edmites en console.anthropic.com\n\u2022 Recibe alertas cuando alcanzas 50%, 80%, 100%\n\u2022 Token limits previenen sorpresas\n\n\ud83d\udccb Mejores Pr\u00e1cticas\n\u2022 Usa SDK oficial (Python/TypeScript)\n\u2022 Implementa retry logic con backoff exponencial\n\u2022 Cachea respuestas cuando sea posible\n\u2022 Monitorea uso de tokens", "points": 10}, {"type": "content", "title": "Pricing y Costos", "text": "Modelo de precios de Claude (por mill\u00f3n de tokens):\n\n\ud83d\udcb5 Claude 3.5 Sonnet (RECOMENDADO)\n\u2022 Input: $3 por mill\u00f3n de tokens\n\u2022 Output: $15 por mill\u00f3n de tokens\n\u2022 Ejemplo: 10K input + 2K output = $0.033 + $0.030 = $0.063\n\n\ud83d\udcb5 Claude 3 Opus\n\u2022 Input: $15 por mill\u00f3n de tokens\n\u2022 Output: $75 por mill\u00f3n de tokens\n\u2022 5x m\u00e1s caro que Sonnet\n\u2022 \u00dasalo solo si necesitas m\u00e1xima capacidad\n\n\ud83d\udcb5 Claude 3 Haiku\n\u2022 Input: $0.80 por mill\u00f3n de tokens\n\u2022 Output: $4 por mill\u00f3n de tokens\n\u2022 Para tareas simples y alto volumen\n\n\ud83c\udf81 Prueba Gratis\n\u2022 $5 en cr\u00e9ditos al registrarse\n\u2022 Suficiente para ~1500 mensajes\n\u2022 V\u00e1lida por 3 meses\n\n\ud83d\udcca Estimaci\u00f3n de Costos\n\u2022 Chatbot t\u00edpico: $0.01-0.05 por mensaje\n\u2022 An\u00e1lisis de documento: $0.10-1.00 por documento\n\u2022 Generaci\u00f3n de c\u00f3digo: $0.05-0.20 por solicitud", "points": 10}, {"type": "challenge", "title": "Desaf\u00edo: Calcula el costo", "instruction": "Env\u00edas 1M tokens de input y recibes 500K de output con Sonnet. \u00bfCu\u00e1nto cuesta en d\u00f3lares?", "answer": "4.50 o 4.5 o 4,50", "hint": "Input: $3/1M, Output: $15/1M. Haz el c\u00e1lculo: (1M \u00d7 $3/1M) + (500K \u00d7 $15/1M)", "points": 25}, {"type": "content", "title": "Casos de Uso Reales", "text": "Aplicaciones pr\u00e1cticas de Claude:\n\n\ud83d\udcdd Generaci\u00f3n de Contenido\n\u2022 Blog posts, emails, social media\n\u2022 Mejora 10x en velocidad\n\u2022 Mantiene tu voz/estilo\n\u2022 Ejemplo: Generar 10 post en minutos\n\n\ud83d\udcbb Desarrollo de Software\n\u2022 Code generation y completion\n\u2022 Code review autom\u00e1tico\n\u2022 Debugging y explicaci\u00f3n de c\u00f3digo\n\u2022 Ejemplo: Generar API en Python en minutos\n\n\ud83d\udd0d An\u00e1lisis y Resumen\n\u2022 An\u00e1lisis de documentos\n\u2022 Extracci\u00f3n de informaci\u00f3n\n\u2022 Resumen de contenido largo\n\u2022 Ejemplo: Resumir 100 p\u00e1ginas de PDF en 2 minutos\n\n\ud83c\udf93 Educaci\u00f3n\n\u2022 Tutores personalizados\n\u2022 Generaci\u00f3n de exercises\n\u2022 Explicaciones adaptadas\n\u2022 Feedback en c\u00f3digo\n\n\ud83e\udd16 Automatizaci\u00f3n\n\u2022 Procesamiento de datos\n\u2022 Clasificaci\u00f3n de textos\n\u2022 Generaci\u00f3n de reportes\n\u2022 Ejemplo: Procesar 1000 emails, extraer info\n\n\ud83d\udd10 Seguridad y Compliance\n\u2022 An\u00e1lisis de riesgos\n\u2022 Auditor\u00eda de code\n\u2022 Generaci\u00f3n de documentaci\u00f3n", "points": 10}, {"type": "interactive_quiz", "title": "Aplicaci\u00f3n correcta", "question": "Tienes 500 emails no estructurados. \u00bfCu\u00e1l es el mejor caso de uso de Claude?", "options": [{"text": "Extracci\u00f3n de informaci\u00f3n clave y clasificaci\u00f3n", "correct": true, "reason": "\u2713 Perfecto: Claude puede procesar lotes de texto, extraer datos, clasificar autom\u00e1ticamente", "points": 20}, {"text": "Reemplazar bandeja de entrada", "correct": false, "reason": "Claude no es un email client", "points": 0}, {"text": "Solo lectura, no procesamiento", "correct": false, "reason": "Claude puede hacer mucho m\u00e1s que leer", "points": 0}], "points": 20}, {"type": "content", "title": "Limitaciones y Consideraciones", "text": "Importante conocer las limitaciones de Claude:\n\n\u26a0\ufe0f Conocimiento Limitado\n\u2022 Entrenado con datos hasta abril 2024\n\u2022 No conoce eventos posteriores\n\u2022 No tiene acceso a internet en tiempo real\n\u2022 Requiere Tool Use para acceder a APIs externas\n\n\u274c No Puede\n\u2022 Navegar internet directamente\n\u2022 Ejecutar c\u00f3digo\n\u2022 Acceder a archivos de tu sistema\n\u2022 Recordar conversaciones previas (sin prompt)\n\u2022 Saber la hora actual sin que la indiques\n\n\u23f1\ufe0f Limitaciones T\u00e9cnicas\n\u2022 Rate limits en API (600 req/min Tier 1)\n\u2022 Costo por token (cuidado con prompts largos)\n\u2022 Latencia: 5-10s para Sonnet, 60-90s para Opus\n\u2022 Output m\u00e1ximo t\u00edpico: 4096 tokens\n\n\ud83d\udd04 Soluciones\n\u2022 Usa Tool Use para integraci\u00f3n con APIs\n\u2022 Divide tareas grandes en m\u00e1s peque\u00f1as\n\u2022 Cachea resultados en tus sistemas\n\u2022 Mant\u00e9n el contexto enfocado\n\u2022 Implementa fallbacks para errores", "points": 10}, {"type": "matching_game", "title": "Conecta caracter\u00edsticas", "pairs": [{"left": "200K tokens", "right": "Context window m\u00e1ximo", "points": 15}, {"left": "Claude 3.5 Sonnet", "right": "Mejor balance velocidad-precio", "points": 15}, {"left": "$3/MTok input", "right": "Precio Sonnet", "points": 15}, {"left": "RLHF", "right": "T\u00e9cnica de entrenamiento", "points": 15}, {"left": "Constitutional AI", "right": "Enfoque de seguridad", "points": 15}]}, {"type": "content", "title": "Mejores Pr\u00e1cticas", "text": "C\u00f3mo sacar el m\u00e1ximo provecho de Claude:\n\n\u2705 DO's\n\u2022 Proporciona contexto claro y espec\u00edfico\n\u2022 Usa ejemplos (few-shot prompting)\n\u2022 Divide tareas complejas en pasos\n\u2022 Especifica el formato de salida deseado\n\u2022 Itera y refina prompts\n\u2022 Usa temperaturas bajas (0.0-0.3) para consistencia\n\u2022 Implementa retry logic con backoff\n\n\u274c DON'Ts\n\u2022 No asumas que Claude conoce eventos recientes\n\u2022 No hardcodees API keys\n\u2022 No env\u00edes informaci\u00f3n sensible sin encriptar\n\u2022 No esperes respuestas id\u00e9nticas (variabilidad natural)\n\u2022 No uses temperaturas altas (0.8+) para tareas cr\u00edticas\n\u2022 No ignores costos en producci\u00f3n\n\n\ud83d\ude80 Optimizaci\u00f3n\n\u2022 Usa max_tokens adecuado (no exageres)\n\u2022 Cachea prompts del sistema largos\n\u2022 Usa Haiku para tareas simples\n\u2022 Monitorea latencia y costos\n\u2022 Prueba diferentes modelos\n\u2022 Implementa logging de prompts/respuestas", "points": 10}, {"type": "badge", "name": "\ud83c\udf93 Experto en Fundamentos", "description": "Completaste M\u00f3dulo 1 - Dominas qu\u00e9 es Claude, c\u00f3mo funcionan los modelos, y c\u00f3mo usarlos responsablemente"}];

            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #3B82F644';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
