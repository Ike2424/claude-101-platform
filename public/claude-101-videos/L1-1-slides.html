<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1-1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #3B82F6; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #3B82F6; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #3B82F6, #3B82F6dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #3B82F666;
        }
        
        .content { 
            flex: 1; overflow-y: auto; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #3B82F6;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #3B82F6; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #3B82F6; background: ##3B82F611; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #3B82F633;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px #3B82F611; }
        
        button { 
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #3B82F644; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##3B82F611; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #3B82F6; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #3B82F6; background: ##3B82F611; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M1 • L1 • Fundamentos</div>
                <div class="title">Módulo 1 - Lección 1</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/11</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "\u00bfQu\u00e9 es Claude?", "text": "Claude es un asistente de IA creado por Anthropic. Es un modelo de lenguaje avanzado entrenado con t\u00e9cnicas de aprendizaje por refuerzo desde retroalimentaci\u00f3n humana (RLHF) para ser seguro, \u00fatil y honesto.\n\nCaracter\u00edsticas principales:\n\u2022 Comprende contexto y matices\n\u2022 Razona sobre problemas complejos\n\u2022 Genera c\u00f3digo de calidad\n\u2022 Mantiene conversaciones naturales", "points": 10}, {"type": "example", "title": "Tu primer llamada a Claude", "code": "from anthropic import Anthropic\n\nclient = Anthropic()\nresponse = client.messages.create(\n    model=\"claude-3-5-sonnet-20241022\",\n    max_tokens=1024,\n    messages=[{\n        \"role\": \"user\",\n        \"content\": \"Expl\u00edcame qu\u00e9 es IA en 2 l\u00edneas\"\n    }]\n)\nprint(response.content[0].text)", "points": 15}, {"type": "content", "title": "Modelos disponibles", "text": "Claude viene en diferentes tama\u00f1os optimizados para diferentes casos:\n\n\ud83d\udcca Claude 3.5 Sonnet\n\u2022 Mejor balance velocidad/precisi\u00f3n\n\u2022 200K tokens de contexto\n\u2022 Ideal para la mayor\u00eda de casos\n\n\u26a1 Claude 3 Opus  \n\u2022 M\u00e1xima capacidad y reasoning\n\u2022 Para tareas muy complejas\n\n\ud83d\ude80 Claude 3 Haiku\n\u2022 M\u00e1s r\u00e1pido y econ\u00f3mico\n\u2022 Para tareas simples", "points": 10}, {"type": "interactive_quiz", "title": "\u00bfCu\u00e1l usar\u00edas para traducir texto r\u00e1pidamente?", "question": "\u00bfCu\u00e1l modelo elegir\u00edas para traducir 1000 emails r\u00e1pidamente y al costo m\u00e1s bajo?", "options": [{"text": "Claude 3.5 Sonnet", "correct": false, "reason": "Bueno pero no es la opci\u00f3n m\u00e1s econ\u00f3mica"}, {"text": "Claude 3 Haiku", "correct": true, "reason": "\u00a1Correcto! Haiku es r\u00e1pido y econ\u00f3mico para tareas simples como traducci\u00f3n"}, {"text": "Claude 3 Opus", "correct": false, "reason": "Demasiado costoso para esta tarea"}], "points": 20}, {"type": "content", "title": "Autenticaci\u00f3n y seguridad", "text": "Para usar la API necesitas:\n\n\ud83d\udd11 API Key\n\u2022 Obt\u00e9n en console.anthropic.com\n\u2022 Gu\u00e1rdala en variable de entorno\n\u2022 NUNCA la compartas p\u00fablicamente\n\n\u26a0\ufe0f Rate Limits\n\u2022 Tier 1: 600 solicitudes/min\n\u2022 Tier 2: 500K tokens/d\u00eda\n\u2022 Aumenta seg\u00fan uso\n\n\ud83d\udcb0 Pricing\n\u2022 Input: $3 / MTok (Sonnet)\n\u2022 Output: $15 / MTok (Sonnet)\n\u2022 Prueba gratis: $5 cr\u00e9ditos", "points": 10}, {"type": "challenge", "title": "Desaf\u00edo: Setup correcto", "instruction": "Completa: Para usar Claude, mi API key debe estar en ___", "answer": "variable de entorno", "hint": "Piensa en d\u00f3nde guardar\u00edas datos sensibles...", "points": 25}, {"type": "matching_game", "title": "Conecta conceptos", "pairs": [{"left": "Haiku", "right": "R\u00e1pido y econ\u00f3mico", "points": 15}, {"left": "Sonnet", "right": "Balance optimo", "points": 15}, {"left": "Opus", "right": "M\u00e1xima capacidad", "points": 15}, {"left": "Context window", "right": "200K tokens", "points": 15}]}, {"type": "content", "title": "Casos de uso reales", "text": "\ud83d\udcdd Content Creation\n\u2022 Blog posts, emails, social\n\u2022 Mejora 10x en velocidad\n\n\ud83d\udcbb Development\n\u2022 Generaci\u00f3n de c\u00f3digo\n\u2022 Code review autom\u00e1tico\n\u2022 Debugging asistido\n\n\ud83d\udd0d Analysis\n\u2022 An\u00e1lisis de documentos\n\u2022 Extracci\u00f3n de informaci\u00f3n\n\u2022 Resumen inteligente\n\n\ud83c\udf93 Education\n\u2022 Tutores personalizados\n\u2022 Explicaciones adaptadas\n\u2022 Quizzes interactivos", "points": 10}, {"type": "interactive_quiz", "title": "\u00bfCu\u00e1l es tu caso de uso?", "question": "\u00bfPara qu\u00e9 usar\u00edas Claude primero?", "options": [{"text": "Generar c\u00f3digo autom\u00e1ticamente", "correct": true, "reason": "\u2713 Excelente caso de uso - Claude es muy bueno generando c\u00f3digo", "points": 20}, {"text": "Reemplazar completamente desarrolladores", "correct": false, "reason": "Claude es un asistente, no un reemplazo", "points": 0}, {"text": "Solo para chatbot", "correct": false, "reason": "Claude es mucho m\u00e1s vers\u00e1til", "points": 0}], "points": 20}, {"type": "badge", "name": "\ud83d\ude80 Fundamentos Dominados", "description": "Completaste M\u00f3dulo 1 - Ahora entiendes qu\u00e9 es Claude y c\u00f3mo usarlo"}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m1l1') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m1l1', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 1 - Lección 1</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #3B82F644';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value.trim();
            if (userAnswer.toLowerCase() === answer.toLowerCase()) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
