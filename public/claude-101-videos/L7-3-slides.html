<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L7-3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #EF4444;
            --bg: #ffffff;
            --text: #1f2937;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.2s; }
        .lesson { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 10px; }
        .progress { height: 2px; background: #e5e7eb; margin-bottom: 10px; }
        [data-theme="dark"] .progress { background: #1e293b; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .header { text-align: center; margin-bottom: 10px; font-size: 13px; }
        .eyebrow { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary); font-weight: 600; }
        .title { font-size: 20px; font-weight: 700; margin: 2px 0; }
        .subtitle { font-size: 11px; color: #6b7280; }
        .slides { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow-y: auto; overflow-x: hidden; padding: 10px 5px; gap: 5px; }
        .flip-card { width: 85%; max-width: 280px; height: 160px; cursor: pointer; perspective: 1000px; margin: 5px auto; flex-shrink: 0; }
        .flip-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; border-radius: 8px; text-align: center; }
        .flip-front { background: var(--primary); color: white; }
        .flip-front .concept { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .flip-front .hint { font-size: 10px; opacity: 0.8; }
        .flip-back { background: white; color: var(--text); border: 1px solid #e5e7eb; transform: rotateY(180deg); }
        [data-theme="dark"] .flip-back { background: #1e293b; border-color: #334155; }
        .flip-back h3 { font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--primary); }
        .flip-back ul { text-align: left; font-size: 10px; line-height: 1.3; }
        .flip-back li { margin: 2px 0; padding-left: 10px; position: relative; }
        .flip-back li:before { content: "•"; position: absolute; left: 0; color: var(--primary); }
        .quiz { width: 85%; max-width: 300px; margin: 5px auto; }
        .quiz-q { font-size: 12px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
        .quiz-opts { display: flex; flex-direction: column; gap: 6px; }
        .quiz-opt { padding: 6px 10px; border: 1px solid #e5e7eb; border-radius: 4px; cursor: pointer; font-size: 11px; background: white; color: var(--text); transition: 0.2s; }
        [data-theme="dark"] .quiz-opt { background: #1e293b; border-color: #334155; }
        .quiz-opt:hover { border-color: var(--primary); background: #f0f9ff; }
        [data-theme="dark"] .quiz-opt:hover { background: #1e293b; }
        .quiz-opt.correct { border-color: #10b981; background: #ecfdf5; color: #047857; }
        [data-theme="dark"] .quiz-opt.correct { background: #064e3b; color: #6ee7b7; }
        .quiz-opt.incorrect { border-color: #ef4444; background: #fef2f2; color: #dc2626; }
        [data-theme="dark"] .quiz-opt.incorrect { background: #7f1d1d; color: #fca5a5; }
        .quiz-feedback { font-size: 10px; margin-top: 6px; display: none; font-weight: 500; }
        .quiz-feedback.show { display: block; }
        .conclusion { text-align: center; padding: 20px; }
        .conclusion .check { font-size: 36px; margin-bottom: 6px; }
        .conclusion h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .conclusion p { font-size: 11px; color: #6b7280; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 6px; border-top: 1px solid #e5e7eb; font-size: 10px; }
        [data-theme="dark"] .nav { border-color: #334155; }
        .nav button { background: none; border: 1px solid #e5e7eb; padding: 4px 8px; border-radius: 3px; font-size: 10px; cursor: pointer; color: var(--text); transition: 0.2s; }
        [data-theme="dark"] .nav button { border-color: #334155; }
        .nav button:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .counter { font-size: 10px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="lesson">
        <div class="progress"><div class="progress-fill"></div></div>
        <div class="header">
            <div class="eyebrow" id="eyebrow"></div>
            <div class="title" id="title"></div>
            <div class="subtitle" id="subtitle"></div>
        </div>
        <div class="slides" id="slides"></div>
        <div class="nav">
            <button class="prev-btn">← Anterior</button>
            <span class="counter"><span id="slide-num">1</span> / <span id="slide-total">20</span></span>
            <button class="next-btn">Siguiente →</button>
        </div>
    </div>
    <script>
        const slideData = [{"type": "intro"}, {"type": "flip", "front": "Concepto Base", "title": "Concepto Base de Limitaciones", "back": ["Definici\u00f3n exacta", "Componentes principales", "Marco conceptual"]}, {"type": "quiz", "question": "\u00bfCu\u00e1l es la definici\u00f3n de Limitaciones?", "options": ["Opci\u00f3n A", "\u2713 Definici\u00f3n exacta", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Uso Pr\u00e1ctico", "title": "Uso Pr\u00e1ctico de Limitaciones", "back": ["M\u00e9todo aplicable", "Pasos a seguir", "Validaci\u00f3n"]}, {"type": "quiz", "question": "\u00bfC\u00f3mo se aplica Limitaciones en la pr\u00e1ctica?", "options": ["Opci\u00f3n A", "\u2713 M\u00e9todo aplicable", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Casos Reales", "title": "Casos Reales de Limitaciones", "back": ["Ejemplo real 1", "Ejemplo real 2", "Contexto pr\u00e1ctico"]}, {"type": "quiz", "question": "\u00bfCu\u00e1l es una ventaja principal de Limitaciones?", "options": ["Opci\u00f3n A", "\u2713 Ejemplo real 1", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Caracter\u00edsticas", "title": "Caracter\u00edsticas de Limitaciones", "back": ["Atributo 1", "Atributo 2", "Atributo 3"]}, {"type": "quiz", "question": "\u00bfEn qu\u00e9 caso de uso brilla Limitaciones?", "options": ["Opci\u00f3n A", "\u2713 Atributo 1", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Ventajas", "title": "Ventajas de Limitaciones", "back": ["Beneficio 1", "Beneficio 2", "Diferenciador"]}, {"type": "quiz", "question": "\u00bfCu\u00e1l es una limitaci\u00f3n de Limitaciones?", "options": ["Opci\u00f3n A", "\u2713 Beneficio 1", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Desventajas", "title": "Desventajas de Limitaciones", "back": ["Limitaci\u00f3n 1", "Limitaci\u00f3n 2", "Consideraci\u00f3n"]}, {"type": "quiz", "question": "\u00bfCu\u00e1l es la mejor pr\u00e1ctica?", "options": ["Opci\u00f3n A", "\u2713 Limitaci\u00f3n 1", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Mejores Pr\u00e1cticas", "title": "Mejores Pr\u00e1cticas de Limitaciones", "back": ["Pr\u00e1ctica 1", "Pr\u00e1ctica 2", "Evitar errores"]}, {"type": "flip", "front": "Integraci\u00f3n", "title": "Integraci\u00f3n de Limitaciones", "back": ["Conexi\u00f3n 1", "Conexi\u00f3n 2", "Escalabilidad"]}, {"type": "end"}];
        const lessonInfo = {"title": "Limitaciones", "description": "L\u00edmites", "eyebrow": "M7 \u2022 L3"};
        let currentSlide = 0;

        function render() {
            const slide = slideData[currentSlide];
            const container = document.getElementById('slides');
            let html = '';

            if (slide.type === 'intro') {
                html = `<div style="text-align: center; padding: 20px;"><div style="font-size: 16px; color: #6b7280; margin-bottom: 10px;">Límites</div><div style="font-size: 24px; font-weight: 700;">Limitaciones</div><div style="font-size: 13px; color: var(--primary); margin-top: 10px;">Toca para comenzar →</div></div>`;
            } else if (slide.type === 'flip') {
                html = `<div class="flip-card"><div class="flip-inner"><div class="flip-front"><div class="concept">${slide.front}</div><div class="hint">Click para voltear</div></div><div class="flip-back"><h3>${slide.title}</h3><ul>${slide.back.map(b => `<li>${b}</li>`).join('')}</ul></div></div></div>`;
            } else if (slide.type === 'quiz') {
                html = `<div class="quiz"><div class="quiz-q">${slide.question}</div><div class="quiz-opts">${slide.options.map((o, i) => `<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}</div><div class="quiz-feedback"></div></div>`;
            } else if (slide.type === 'end') {
                html = `<div class="conclusion"><div class="check">✓</div><h2>Completado</h2><p>¡Excelente trabajo!</p></div>`;
            }

            container.innerHTML = html;
            updateUI();
            attachEvents();
        }

        function updateUI() {
            const prog = ((currentSlide + 1) / slideData.length) * 100;
            document.querySelector('.progress-fill').style.width = prog + '%';
            document.getElementById('slide-num').textContent = currentSlide + 1;
            document.getElementById('slide-total').textContent = slideData.length;
            document.getElementById('eyebrow').textContent = lessonInfo.eyebrow;
            document.getElementById('title').textContent = lessonInfo.title;
            document.getElementById('subtitle').textContent = lessonInfo.description;
        }

        function attachEvents() {
            const flipCard = document.querySelector('.flip-card');
            if (flipCard) {
                flipCard.addEventListener('click', () => {
                    flipCard.classList.toggle('flipped');
                });
            }

            const quizOpts = document.querySelectorAll('.quiz-opt');
            quizOpts.forEach(opt => {
                opt.addEventListener('click', () => {
                    if (opt.classList.contains('correct') || opt.classList.contains('incorrect')) return;
                    const isCorrect = parseInt(opt.dataset.i) === slideData[currentSlide].correct;
                    const feedback = document.querySelector('.quiz-feedback');
                    if (isCorrect) {
                        opt.classList.add('correct');
                        feedback.textContent = '✓ ¡Correcto!';
                        feedback.style.color = '#047857';
                    } else {
                        opt.classList.add('incorrect');
                        feedback.textContent = '✗ Incorrecto, intenta otra';
                        feedback.style.color = '#dc2626';
                    }
                    feedback.classList.add('show');
                    quizOpts.forEach(o => o.style.pointerEvents = 'none');
                });
            });
        }

        document.querySelector('.prev-btn').addEventListener('click', () => {
            if (currentSlide > 0) currentSlide--;
            render();
        });

        document.querySelector('.next-btn').addEventListener('click', () => {
            if (currentSlide < slideData.length - 1) currentSlide++;
            render();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentSlide > 0) { currentSlide--; render(); }
            if (e.key === 'ArrowRight' && currentSlide < slideData.length - 1) { currentSlide++; render(); }
        });

        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        render();
    </script>
</body>
</html>
