as, no aprendes a integrar."}, {"type": "scenarios", "title": "¿Buen <em>proyecto</em>?", "list": [{"text": "\"Plantilla para escribir el resumen ejecutivo de informes semanales con tono de mi empresa.\"", "options": ["Muy pequeño", "Excelente: tarea real, repetitiva, valor inmediato", "Falta ambición"], "correct": 1, "feedback": "Excelente. Cumple los tres criterios: real, repetitivo, alto valor. Te ahorra 1-2 horas semanales."}, {"text": "\"Sistema de IA que aprenda solo a invertir en cripto.\"", "options": ["Ambicioso, vamos", "Demasiado grande, demasiado vago, alto riesgo financiero", "Sigue"], "correct": 1, "feedback": "No es proyecto final, es proyecto de empresa. Empieza por algo más acotado para aprender el flujo."}, {"text": "\"Asistente personal que organice mis emails y agenda.\"", "options": ["Empieza con lo más simple: clasificar emails entrantes en 3 categorías", "Hazlo todo", "No se puede"], "correct": 0, "feedback": "Descompone en piezas. Empieza por la pieza más simple que da valor (clasificar emails). Si funciona, sigues construyendo."}]}, {"type": "recap", "list": [{"q": "Criterio del proyecto final:", "options": ["Que sea grande", "Tarea real + repetitiva + tuya", "Que impresione"], "correct": 1, "explain": "Real, repetitivo, tuyo. Esos tres atributos garantizan valor inmediato."}, {"q": "¿Cuál es el siguiente paso real después de este curso?", "options": ["Hacer otro curso", "Elegir UNA tarea tuya y aplicar lo aprendido esta semana", "Esperar"], "correct": 1, "explain": "Aplicar. Sin aplicar, el curso es entretenimiento. Aplicar = aprender de verdad."}]}, {"type": "final", "title": "Has terminado <em>Claude 101</em>", "subtitle": "Acceso, prompting, técnicas, capacidades, casos, buenas prácticas, herramientas avanzadas. En M9 BONUS: desarrollo avanzado (Constitutional AI, Skills, agentes, MCP) para quienes quieran construir.", "ctaLabel": "Marcar lección 8.4 completada →"}]};
