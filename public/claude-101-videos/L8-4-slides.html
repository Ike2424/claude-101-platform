<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L8-4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #06B6D4; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #06B6D4; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #06B6D4, #06B6D4dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #06B6D4, #06B6D4dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #06B6D466;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #06B6D4;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #06B6D4; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #06B6D4; background: ##06B6D411; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #06B6D4, #06B6D4dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #06B6D433;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #06B6D4; box-shadow: 0 0 0 3px #06B6D411; }
        
        button { 
            background: linear-gradient(135deg, #06B6D4, #06B6D4dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #06B6D444; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##06B6D411; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #06B6D4; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #06B6D4; background: ##06B6D411; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M8 • L4 • Siguiente nivel</div>
                <div class="title">Módulo 8 - Lección 4</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Pon todo en practica", "text": "El proyecto final integra lo aprendido: elige un problema real y resuelvelo de principio a fin usando buenas tecnicas de prompting y, si aplica, herramientas.", "points": 10}, {"type": "content", "title": "Pasos sugeridos", "text": "1) Define el objetivo y el entregable\n2) Reune el contexto y los datos\n3) Disena el prompt (rol, tarea, contexto, formato)\n4) Itera y refina con feedback\n5) Verifica el resultado\n6) Documenta tu mejor prompt", "points": 10}, {"type": "content", "title": "Ideas de proyecto", "text": "• Un asistente de redaccion para tu trabajo\n• Un analizador de tus documentos o datos\n• Un generador de contenido para tu marca\n• Un flujo que conecte Claude con una de tus apps (MCP)", "points": 10}, {"type": "example", "title": "Plantilla de brief del proyecto", "code": "Objetivo: <que problema resuelvo>\nEntregable: <que produzco exactamente>\nContexto/datos: <que necesita Claude>\nTecnicas: <few-shot, CoT, etiquetas, herramientas>\nCriterio de exito: <como se que quedo bien>", "points": 15}, {"type": "content", "title": "Checklist final", "text": "✅ El prompt define rol, tarea, contexto y formato\n✅ Probaste con casos reales\n✅ Verificaste los datos criticos\n✅ Guardaste la plantilla reutilizable\n✅ El entregable cumple el criterio de exito", "points": 10}, {"type": "interactive_quiz", "title": "Que NO debe faltar en tu proyecto?", "question": "Cual es un paso imprescindible antes de dar por bueno el resultado?", "options": [{"text": "Verificar el resultado", "correct": true, "reason": "Correcto: la verificacion es clave antes de usar/publicar.", "points": 20}, {"text": "Hacerlo en ingles", "correct": false, "reason": "El idioma depende de tu caso, no es imprescindible.", "points": 0}, {"text": "Usar el modelo mas caro", "correct": false, "reason": "No hace falta; elige el adecuado a la tarea.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: primer paso", "instruction": "Cual es el primer paso de un buen proyecto: definir el ___? (una palabra)", "answer": "objetivo", "hint": "Todo empieza por definir el objetivo y el entregable.", "points": 25}, {"type": "matching_game", "title": "Proyecto final", "pairs": [{"left": "Paso 1", "right": "Definir objetivo", "points": 15}, {"left": "Diseno", "right": "Rol/tarea/contexto/formato", "points": 15}, {"left": "Antes de cerrar", "right": "Verificar", "points": 15}, {"left": "Reutilizar", "right": "Guardar plantilla", "points": 15}]}, {"type": "content", "title": "Elige un problema que te duela", "text": "El mejor proyecto resuelve una molestia real tuya:\n\n• Algo que haces a mano cada semana\n• Una tarea que odias por repetitiva\n• Un cuello de botella en tu trabajo\n\nSi resuelve un dolor real, lo usaras de verdad y veras el valor de inmediato.", "points": 10}, {"type": "content", "title": "Aplica todo lo aprendido", "text": "Tu proyecto deberia usar varias piezas del curso:\n\n• Buen prompt (rol, tarea, contexto, formato) — M3\n• Tecnica avanzada si aplica (CoT, few-shot) — M4\n• Una herramienta (Artifacts, busqueda, archivos) — M5\n• Verificacion de lo critico — M7\n\nIntegrar varias piezas es lo que convierte el aprendizaje en habilidad.", "points": 10}, {"type": "content", "title": "Mide si funciona", "text": "Define un criterio de exito ANTES de empezar:\n\n• 'Me ahorra 2 horas a la semana'\n• 'El borrador sale listo en un 80%'\n• 'Reduce errores en X'\n\nSin criterio no sabras si funciono. Con criterio, puedes mejorarlo iteracion a iteracion.", "points": 10}, {"type": "example", "title": "Plantilla de brief del proyecto", "code": "Objetivo: <que problema resuelvo>\nEntregable: <que produzco exactamente>\nContexto/datos: <que necesita Claude>\nTecnicas: <few-shot, CoT, etiquetas, herramientas>\nCriterio de exito: <como se que quedo bien>", "points": 15}, {"type": "interactive_quiz", "title": "Que NO debe faltar antes de dar por bueno el proyecto?", "question": "Cual paso es imprescindible?", "options": [{"text": "Verificar el resultado", "correct": true, "reason": "Correcto: la verificacion es clave antes de usar/publicar.", "points": 20}, {"text": "Hacerlo en ingles", "correct": false, "reason": "El idioma depende de tu caso.", "points": 0}, {"text": "Usar el modelo mas caro", "correct": false, "reason": "Elige el adecuado, no el mas caro.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen del modulo 8", "text": "Diste el salto al siguiente nivel:\n• Claude Code para desarrolladores\n• Integraciones y conectores MCP\n• Recursos para seguir aprendiendo\n• Tu proyecto final\n\nSi quieres ir aun mas lejos, el modulo 9 BONUS abre la caja de herramientas avanzada.", "points": 10}, {"type": "badge", "name": "🏆 Proyecto Completado", "description": "Integraste todo lo aprendido en un proyecto real de principio a fin."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m8l4') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m8l4', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 8 - Lección 4</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #06B6D444';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
