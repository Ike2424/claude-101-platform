<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3-4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #A855F7; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #A855F7; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #A855F7, #A855F7dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #A855F766;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #A855F7;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #A855F7; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #A855F7; background: ##A855F711; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #A855F733;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #A855F7; box-shadow: 0 0 0 3px #A855F711; }
        
        button { 
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #A855F744; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##A855F711; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #A855F7; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #A855F7; background: ##A855F711; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M3 • L4 • Prompting</div>
                <div class="title">Módulo 3 - Lección 4</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Error 1: pedir demasiado de golpe", "text": "Meter 5 tareas en un prompt produce respuestas superficiales en todas.\n\nSintoma: \"Analiza, resume, traduce, corrige y dame ideas\" en una linea.\n\nArreglo: divide en pasos. Una tarea principal por mensaje; encadena despues.", "points": 10}, {"type": "content", "title": "Error 2: ser ambiguo y luego frustrarse", "text": "Si el resultado no te gusta, casi siempre el prompt era ambiguo.\n\nAntes de reescribir el prompt entero, di que cambiar: \"mas corto\", \"mas formal\", \"sin la introduccion\". Claude itera muy bien con feedback concreto.", "points": 10}, {"type": "content", "title": "Error 3: asumir que conoce datos privados o recientes", "text": "Claude no conoce:\n• Tus documentos internos (a menos que los pegues)\n• Eventos posteriores a su entrenamiento\n• Tu contexto personal no escrito\n\nArreglo: pega el material y, para datos actuales, usa busqueda web o herramientas.", "points": 10}, {"type": "content", "title": "Error 4: confiar sin verificar", "text": "Claude puede sonar muy seguro y aun asi equivocarse (alucinacion).\n\nRiesgo alto en: cifras, citas, leyes, fechas, nombres propios.\n\nArreglo: pide que indique su nivel de confianza o que cite la fuente, y verifica los datos criticos por tu cuenta.", "points": 10}, {"type": "content", "title": "Error 5: prompts sin formato de salida", "text": "Si no dices como quieres la respuesta, recibes texto libre dificil de reutilizar.\n\nArreglo: termina el prompt con el formato exacto: \"Devuelve solo una tabla con columnas X, Y, Z\".", "points": 10}, {"type": "example", "title": "Antidoto: el prompt 'a prueba de errores'", "code": "Tarea unica: clasifica estos comentarios como POSITIVO/NEGATIVO/NEUTRO.\nMaterial: <<<\n  ...comentarios...\n>>>\nReglas: si dudas, marca NEUTRO. No expliques.\nFormato: tabla de 2 columnas (comentario, etiqueta).", "points": 15}, {"type": "interactive_quiz", "title": "Que error comete este prompt?", "question": "\"Eres abogado. Dame el articulo exacto del codigo civil que aplica a mi caso\" (sin dar el caso ni pais).", "options": [{"text": "Asume datos que no tiene + falta contexto", "correct": true, "reason": "Correcto: no dio el caso ni el pais, y pide una cita exacta verificable.", "points": 20}, {"text": "Es demasiado corto", "correct": false, "reason": "La longitud no es el problema, sino la falta de datos y el riesgo de cita inventada.", "points": 0}, {"text": "Usa rol, eso esta mal", "correct": false, "reason": "Usar un rol es correcto; el problema es otro.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: cuantas tareas?", "instruction": "Cuantas tareas distintas mete este prompt: \"resume, traduce al ingles y dame 3 hashtags\"?", "answer": "3", "hint": "Resumir, traducir y generar hashtags son tres tareas; conviene separarlas.", "points": 25}, {"type": "matching_game", "title": "Error y solucion", "pairs": [{"left": "Demasiadas tareas", "right": "Una por prompt", "points": 15}, {"left": "Ambiguedad", "right": "Feedback concreto", "points": 15}, {"left": "Datos inventados", "right": "Verificar y citar", "points": 15}, {"left": "Salida desordenada", "right": "Definir formato", "points": 15}]}, {"type": "content", "title": "Error 6: no iterar", "text": "El mayor error invisible: pedir una vez, conformarte y cerrar.\n\nLos mejores resultados casi nunca salen al primer intento. Claude esta disenado para iterar:\n• 'Mas corto'\n• 'Cambia el tono'\n• 'Desarrolla el punto 2'\n\nTrata el primer resultado como un borrador, no como la respuesta final.", "points": 10}, {"type": "content", "title": "Error 7: pelearse en vez de reformular", "text": "Si tras 2-3 intentos no mejora, no insistas con lo mismo: reformula desde cero.\n\n• Cambia el enfoque del prompt\n• Anade un ejemplo del resultado ideal\n• Divide la tarea en partes\n\nA veces, empezar un chat nuevo y limpio resuelve lo que mil correcciones no lograban.", "points": 10}, {"type": "content", "title": "La checklist anti-errores", "text": "Antes de dar por bueno un prompt, repasa:\n\n✅ Una sola tarea principal\n✅ Contexto y material incluidos\n✅ Audiencia y formato definidos\n✅ Datos criticos a verificar identificados\n✅ Plan B si el resultado no convence (iterar/reformular)\n\nCinco comprobaciones que evitan el 90% de los problemas.", "points": 10}, {"type": "interactive_quiz", "title": "Que hacer si el resultado no convence tras varios intentos?", "question": "Llevas 3 correcciones y no mejora. Que es lo mas sensato?", "options": [{"text": "Repetir la misma correccion mas fuerte", "correct": false, "reason": "Insistir igual no suele cambiar nada.", "points": 0}, {"text": "Reformular desde cero o empezar un chat limpio", "correct": true, "reason": "Correcto: cambiar el enfoque suele desbloquear.", "points": 20}, {"text": "Rendirse y hacerlo a mano", "correct": false, "reason": "Antes de eso, reformular casi siempre funciona.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen del modulo 3", "text": "Ya dominas el arte del prompt:\n• La anatomia (rol, tarea, contexto, formato)\n• El poder del contexto y la especificidad\n• Casos reales antes/despues\n• Los errores a evitar y como iterar\n\nEn el modulo 4 subimos de nivel con tecnicas avanzadas: razonamiento, few-shot, etiquetas y roles.", "points": 10}, {"type": "badge", "name": "🚦 Detector de Errores", "description": "Reconoces y evitas los errores de prompting mas comunes."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m3l4') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m3l4', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 3 - Lección 4</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #A855F744';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
