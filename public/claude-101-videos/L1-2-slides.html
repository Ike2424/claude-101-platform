<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1-2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #3B82F6; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #3B82F6; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #3B82F6, #3B82F6dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #3B82F666;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #3B82F6;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #3B82F6; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #3B82F6; background: ##3B82F611; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #3B82F633;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px #3B82F611; }
        
        button { 
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #3B82F644; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##3B82F611; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #3B82F6; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #3B82F6; background: ##3B82F611; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M1 • L2 • Fundamentos</div>
                <div class="title">Módulo 1 - Lección 2</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/18</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Una familia, no un solo modelo", "text": "Claude no es un unico modelo: es una familia con varios tamanos pensados para distintas necesidades.\n\nLos tres perfiles clasicos son Haiku, Sonnet y Opus, ordenados de mas ligero a mas potente.\n\nLa idea central de toda la leccion: no existe 'el mejor modelo', existe 'el mejor modelo para ESTA tarea'. Aprender a elegir te ahorra tiempo y dinero.", "points": 10}, {"type": "content", "title": "La analogia de los vehiculos", "text": "Para fijar la idea, piensa en transporte:\n\n🛵 Haiku = una moto\n• Agil, barata, perfecta para trayectos cortos y frecuentes\n\n🚗 Sonnet = un coche\n• Equilibrio entre velocidad, capacidad y consumo. Sirve para casi todo\n\n🚚 Opus = un camion\n• Mueve cargas pesadas, pero es mas lento y caro de operar\n\nNadie usa un camion para ir a por el pan, ni una moto para una mudanza.", "points": 10}, {"type": "content", "title": "Haiku: rapido y ligero", "text": "El mas veloz y economico de la familia.\n\nIdeal para:\n• Tareas simples y de alto volumen\n• Clasificacion (spam/no spam, positivo/negativo)\n• Extraccion de datos sencillos\n• Respuestas cortas donde la latencia importa\n\nPiensa en el para automatizaciones que corren miles de veces: cada milisegundo y cada centimo se multiplican.", "points": 10}, {"type": "content", "title": "Sonnet: el equilibrio (el que mas usaras)", "text": "El punto medio entre velocidad y capacidad. Para la mayoria de la gente es el modelo del dia a dia.\n\nIdeal para:\n• Redaccion y edicion de textos\n• Analisis de documentos\n• Programacion cotidiana\n• Tareas con buen razonamiento sin esperar demasiado\n\nRegla practica: empieza SIEMPRE por Sonnet. Solo cambia si una tarea concreta te pide menos (Haiku) o mas (Opus).", "points": 10}, {"type": "content", "title": "Opus: la maxima capacidad", "text": "El mas potente para problemas verdaderamente complejos.\n\nIdeal para:\n• Razonamiento profundo y multi-paso\n• Analisis matizado de temas delicados\n• Escritura sofisticada y de marca\n• Problemas donde un error sale caro\n\nEs mas lento y costoso, asi que reservalo para cuando la calidad pesa mas que el tiempo o el dinero.", "points": 10}, {"type": "content", "title": "El triangulo: velocidad, capacidad, costo", "text": "Toda eleccion de modelo equilibra tres fuerzas:\n\n⚡ Velocidad: cuanto tarda en responder\n🧠 Capacidad: que tan complejo puede razonar\n💰 Costo: cuanto cuesta cada uso\n\nNo puedes maximizar las tres a la vez. Haiku prioriza velocidad/costo; Opus prioriza capacidad; Sonnet busca el centro.\n\nElegir bien = saber cual de las tres fuerzas domina TU tarea.", "points": 10}, {"type": "content", "title": "Como elegir en 3 preguntas", "text": "Hazte estas preguntas en orden:\n\n1. Es una tarea simple y repetitiva (clasificar, extraer)?\n   -> Haiku\n\n2. Es trabajo general del dia a dia (escribir, analizar, programar)?\n   -> Sonnet\n\n3. Es muy compleja y un error sale caro?\n   -> Opus\n\nAnte la duda, Sonnet casi nunca falla como punto de partida.", "points": 10}, {"type": "content", "title": "Errores comunes al elegir", "text": "❌ Usar siempre el mas potente 'por si acaso'\n• Pagas de mas y esperas de mas sin necesidad\n\n❌ Usar el mas barato para todo\n• Te frustras cuando se queda corto en tareas complejas\n\n❌ No probar alternativas\n• A veces Haiku resuelve algo que creias que necesitaba Opus\n\n✅ Lo sano: prototipa con Sonnet, mide, y ajusta hacia arriba o abajo.", "points": 10}, {"type": "content", "title": "El mismo prompt, distinto modelo", "text": "Una buena practica: prueba tu tarea en dos modelos y compara.\n\n• Si Haiku da un resultado igual de bueno que Sonnet -> usa Haiku y ahorra\n• Si Sonnet falla en matiz -> sube a Opus solo en esa tarea\n\nLa eleccion no es para siempre: puedes usar modelos distintos para partes distintas de un mismo flujo.", "points": 10}, {"type": "example", "title": "Pensar la eleccion como codigo", "code": "# Pseudocodigo de decision\ndef elegir_modelo(tarea):\n    if tarea.es_simple and tarea.alto_volumen:\n        return 'haiku'    # rapido y barato\n    if tarea.es_muy_compleja or tarea.error_caro:\n        return 'opus'     # maxima capacidad\n    return 'sonnet'       # el equilibrio por defecto", "points": 15}, {"type": "interactive_quiz", "title": "Cual modelo para alto volumen simple?", "question": "Necesitas clasificar miles de mensajes cortos lo mas rapido y barato posible. Cual eliges?", "options": [{"text": "Haiku", "correct": true, "reason": "Correcto: el mas rapido y economico, ideal para volumen simple.", "points": 20}, {"text": "Opus", "correct": false, "reason": "Seria potente pero lento y caro para una tarea simple.", "points": 0}, {"text": "Ninguno sirve", "correct": false, "reason": "Haiku encaja perfecto en este caso.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "Cual es el modelo 'por defecto'?", "question": "Para el trabajo general del dia a dia, por cual conviene empezar?", "options": [{"text": "Opus siempre", "correct": false, "reason": "Suele ser excesivo y caro para tareas cotidianas.", "points": 0}, {"text": "Sonnet", "correct": true, "reason": "Correcto: el mejor equilibrio para la mayoria de tareas.", "points": 20}, {"text": "Haiku para todo", "correct": false, "reason": "Haiku se queda corto en razonamiento complejo.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "Cuando subir a Opus?", "question": "En cual situacion tiene mas sentido pagar por Opus?", "options": [{"text": "Para traducir una frase corta", "correct": false, "reason": "Eso lo hace Haiku de sobra.", "points": 0}, {"text": "Para un analisis legal complejo donde un error sale caro", "correct": true, "reason": "Correcto: maxima capacidad cuando la calidad es critica.", "points": 20}, {"text": "Para clasificar tickets por volumen", "correct": false, "reason": "Volumen simple = Haiku.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: el equilibrado", "instruction": "Cual de los tres modelos es el equilibrio recomendado para empezar el dia a dia? (una palabra)", "answer": "Sonnet", "hint": "Sonnet es el punto medio entre velocidad y capacidad.", "points": 25}, {"type": "matching_game", "title": "Modelo y perfil", "pairs": [{"left": "Haiku", "right": "Rapido y economico", "points": 15}, {"left": "Sonnet", "right": "Equilibrio del dia a dia", "points": 15}, {"left": "Opus", "right": "Maxima capacidad", "points": 15}, {"left": "Velocidad", "right": "Cuanto tarda", "points": 15}, {"left": "Costo", "right": "Cuanto cuesta cada uso", "points": 15}]}, {"type": "content", "title": "Resumen de la leccion", "text": "• Claude es una familia: Haiku, Sonnet, Opus\n• Cada uno equilibra velocidad, capacidad y costo de forma distinta\n• Empieza por Sonnet; baja a Haiku para lo simple, sube a Opus para lo complejo\n• La eleccion la decide la tarea, no el ego de usar 'el mas grande'\n\nEn la siguiente leccion abrimos el capo: como razona Claude por dentro.", "points": 10}, {"type": "badge", "name": "🧬 Conocedor de Modelos", "description": "Sabes elegir entre Haiku, Sonnet y Opus equilibrando velocidad, capacidad y costo."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m1l2') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m1l2', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 1 - Lección 2</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #3B82F644';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
