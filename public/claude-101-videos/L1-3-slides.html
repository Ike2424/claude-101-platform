window.MODULE_DATA = {"module": 1, "lessonId": "l1-3", "lessonNumber": "1.3", "title": "Cómo razona Claude", "slides": [{"type": "intro", "title": "Tu <em>intuición</em> sobre cómo razona", "subtitle": "¿Qué crees que hace Claude por dentro cuando responde una pregunta? Toca las que apliquen.", "chips": ["Busca en internet", "Predice texto", "Tiene base de datos", "Razona como humano", "No lo sé"]}, {"type": "choice", "eyebrow": "Pregunta 1", "title": "¿Cómo <em>genera</em> Claude su respuesta?", "prompt": "Cuando le preguntas algo, lo que pasa por dentro es...", "options": ["Busca la respuesta en una base de datos interna", "Predice el siguiente texto más probable basándose en patrones aprendidos", "Conecta a Wikipedia en tiempo real", "Llama a otros modelos especializados"], "correct": 1, "feedback": "Predicción de texto. Claude no consulta una base de datos cuando responde — genera la respuesta más probable basándose en patrones de su entrenamiento. Esto tiene dos consecuencias importantes: 1) puede sonar seguro incluso cuando se equivoca, 2) funciona mejor cuanto más claro es el contexto."}, {"type": "reveal", "title": "Tres <em>cosas</em> que debes saber", "prompt": "Abre cada tarjeta. Cambia cómo lo usas.", "items": [{"icon": "🎲", "name": "Alucinaciones", "tag": "Cuidado", "body": "Puede inventar cifras, fechas, nombres o \"fuentes\" con tono convincente. No es un bug, es cómo funciona la predicción. Verifica todo dato factual relevante."}, {"icon": "🪟", "name": "Ventana de contexto", "tag": "Memoria", "body": "Lo que puede \"tener en la cabeza\" en una conversación. Es enorme (cientos de páginas) pero no infinita. Conversaciones muy largas pueden empezar a olvidar el principio."}, {"icon": "🤔", "name": "Pensamiento extendido", "tag": "CoT", "body": "Cuando le pides \"razona paso a paso\", Claude dedica más tiempo a pensar antes de responder. Mejora notablemente en mates, lógica y problemas multipaso."}], "feedbackHead": "Listo.", "feedback": "Alucinaciones, contexto y razonamiento extendido. Si conoces estas tres cosas, ya no usas Claude como un buscador, lo usas como lo que es: un colaborador con habilidades y límites concretos."}, {"type": "tf", "title": "Sobre <em>certeza</em>", "statement": "\"Si Claude expresa una respuesta con tono muy seguro, es porque está muy seguro de lo que dice.\"", "correct": false, "feedback": "Falso. El tono de seguridad no correlaciona con precisión. Claude puede sonar seguro mientras alucina, y dudar de cosas que sabe bien. Confía en el contenido, no en el tono."}, {"type": "scenarios", "title": "Cuándo <em>verificar</em>", "list": [{"text": "\"Claude me da una cifra precisa: 23.7% de aumento. Para mi informe.\"", "options": ["Confío y la pongo", "Verifico la fuente y el cálculo antes", "La redondeo"], "correct": 1, "feedback": "Verifica. Cifras precisas con coma decimal son uno de los lugares donde Claude alucina más fácilmente. Pide su origen y comprueba."}, {"text": "\"Claude me ayuda a entender un concepto teórico que conozco un poco.\"", "options": ["Verifico cada frase", "Lo leo de forma activa, sin auto-verificar palabra por palabra", "No le creo nada"], "correct": 1, "feedback": "Lectura activa. Para conceptos generales suele acertar. Pero si tu intuición chirría con algo, profundiza ahí."}, {"text": "\"Claude me sugiere reformular un párrafo que escribí.\"", "options": ["Verifico cada cambio", "Lo leo y decido si me gusta más o no", "Lo acepto siempre"], "correct": 1, "feedback": "Decisión editorial. No hay \"verdad\" que verificar — es tu criterio. Acéptalo, modifícalo o descártalo según te suene."}]}, {"type": "recap", "list": [{"q": "Si Claude alucina con frecuencia en lo factual, ¿significa que no sirve?", "options": ["Sí, no es fiable", "No, sirve mucho — pero hay que saber cuándo verificar y cuándo no", "Sí, mejor usar buscador"], "correct": 1, "explain": "Saber cuándo verificar es lo que separa al usuario torpe del experto. Para reformulaciones, ideas, redacción: confía. Para datos concretos: verifica."}, {"q": "¿Por qué darle contexto mejora la respuesta?", "options": ["Acelera la generación", "Reduce la incertidumbre de predicción y aumenta la calidad", "Le da más tokens disponibles"], "correct": 1, "explain": "Más contexto = menos predicción \"a ciegas\". Si le dices quién eres, qué quieres y para quién, la respuesta más probable es también la más relevante."}]}, {"type": "final", "title": "Sabes <em>cómo piensa</em>", "subtitle": "Predice, no busca. Puede alucinar. Tiene ventana de contexto. Razona si se lo pides. En la siguiente lección: diferencias con otros asistentes.", "ctaLabel": "Marcar lección 1.3 completada →"}]};
