<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1-3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #3B82F6; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #3B82F6; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #3B82F6, #3B82F6dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #3B82F666;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #3B82F6;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #3B82F6; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #3B82F6; background: ##3B82F611; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #3B82F633;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px #3B82F611; }
        
        button { 
            background: linear-gradient(135deg, #3B82F6, #3B82F6dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #3B82F644; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##3B82F611; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #3B82F6; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #3B82F6; background: ##3B82F611; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M1 • L3 • Fundamentos</div>
                <div class="title">Módulo 1 - Lección 3</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/19</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Predice, no consulta", "text": "Claude genera texto prediciendo, palabra a palabra, lo mas probable segun los patrones que aprendio durante su entrenamiento.\n\nNo consulta una base de datos ni 'busca' la respuesta en ningun sitio: la CONSTRUYE sobre la marcha.\n\nEsta sola idea explica casi todo su comportamiento: por que es tan flexible, por que a veces se equivoca, y por que el contexto que le das cambia tanto el resultado.", "points": 10}, {"type": "content", "title": "La maquina de autocompletar (muy potente)", "text": "En el fondo, Claude es un autocompletado extraordinariamente sofisticado.\n\n• Mira todo el texto hasta ahora (tu prompt + lo que lleva escrito)\n• Calcula que palabra es la mas probable que venga despues\n• La escribe, y repite\n\nLo asombroso es que, a partir de ese mecanismo simple, emergen razonamiento, traduccion y creatividad. Pero en su nucleo sigue siendo prediccion.", "points": 10}, {"type": "content", "title": "Que son los tokens", "text": "Claude no ve 'palabras' exactamente, ve tokens: trozos de texto.\n\n• Un token es ~4 caracteres en promedio\n• Una palabra suele ser 1-2 tokens\n• 1000 palabras ≈ 1300 tokens\n\nImporta porque: el costo y el limite de contexto se miden en tokens, no en palabras. Textos mas largos = mas tokens = mas costo y mas tiempo.", "points": 10}, {"type": "content", "title": "El context window: su memoria de trabajo", "text": "El context window es todo el texto que Claude puede 'tener presente' a la vez en una conversacion.\n\n• Incluye tus instrucciones + el material + toda la charla previa\n• Es enorme: caben decenas o cientos de paginas\n• Pero tiene un limite: lo mas antiguo puede salir si la conversacion crece mucho\n\nEs su memoria a corto plazo: dentro de ella recuerda todo; fuera, no.", "points": 10}, {"type": "content", "title": "Que es 'alucinar'", "text": "Una alucinacion es cuando Claude da una respuesta que suena segura y plausible pero es falsa.\n\nNo miente a proposito: como genera por probabilidad, a veces el texto 'mas probable' no es el verdadero.\n\nOcurre mas en:\n• Cifras y datos muy especificos\n• Citas, fechas y nombres propios\n• Temas muy recientes o de nicho\n\nLa seguridad del tono NO garantiza que tenga razon.", "points": 10}, {"type": "content", "title": "Por que el tono seguro engana", "text": "Claude siempre escribe con fluidez, tenga razon o no. Esa fluidez puede dar una falsa sensacion de certeza.\n\nRegla de oro:\n• Para ideas, redaccion y brainstorming -> confia y itera\n• Para datos verificables (numeros, leyes, citas) -> verifica siempre\n\nTrata a Claude como un colega brillante pero que a veces se equivoca con seguridad.", "points": 10}, {"type": "content", "title": "Puede pensar paso a paso", "text": "En problemas complejos, Claude rinde mucho mejor si razona ANTES de dar la respuesta final.\n\nPedir 'piensa paso a paso' le hace:\n• Descomponer el problema en partes\n• Mostrar calculos intermedios\n• Detectar sus propios errores\n• Llegar a conclusiones mas fiables\n\nEs una de las tecnicas mas potentes; la veras a fondo en el modulo 4.", "points": 10}, {"type": "content", "title": "Probabilidad = variabilidad", "text": "Como genera por probabilidades, la misma pregunta puede dar respuestas algo distintas cada vez.\n\n• Es normal, no es un fallo\n• A veces es util (variedad de ideas)\n• A veces molesta (quieres consistencia)\n\nPara resultados mas consistentes: da instrucciones precisas, formato fijo y ejemplos. Cuanto mas acotas, menos varia.", "points": 10}, {"type": "content", "title": "Conocimiento con fecha de corte", "text": "Claude se entrena hasta cierta fecha y no conoce nada posterior por si solo.\n\n• No sabe la noticia de hoy\n• No conoce tus documentos privados\n• No sabe la hora actual si no se la dices\n\nPara datos recientes, usa busqueda web; para datos tuyos, pegalos en el prompt. Lo veremos en M5 y M7.", "points": 10}, {"type": "example", "title": "Hacer que razone en voz alta", "code": "Resuelve este problema paso a paso, mostrando cada calculo,\ny solo al final escribe la respuesta:\n\nUn articulo cuesta 80€. Le aplico una subida del 25%\ny luego un descuento del 10%. Cual es el precio final?\n\n# Claude razona:\n# 1) 80 x 1.25 = 100\n# 2) 100 x 0.90 = 90\n# Respuesta: 90€", "points": 15}, {"type": "interactive_quiz", "title": "Como genera Claude sus respuestas?", "question": "Cual descripcion es la correcta?", "options": [{"text": "Busca la respuesta en internet", "correct": false, "reason": "No navega por defecto; predice el texto.", "points": 0}, {"text": "Predice el texto mas probable segun patrones aprendidos", "correct": true, "reason": "Correcto: genera por probabilidad, no por consulta.", "points": 20}, {"text": "Copia de una base de datos fija", "correct": false, "reason": "No copia de una base de datos; construye la respuesta.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "Que es una alucinacion?", "question": "Como se describe mejor?", "options": [{"text": "Un fallo de conexion a internet", "correct": false, "reason": "No es un problema tecnico de red.", "points": 0}, {"text": "Una respuesta que suena segura pero es falsa", "correct": true, "reason": "Correcto: plausible en la forma, incorrecta en el fondo.", "points": 20}, {"text": "Cuando el modelo se apaga", "correct": false, "reason": "No tiene que ver con apagarse.", "points": 0}], "points": 20}, {"type": "interactive_quiz", "title": "Como obtener respuestas mas consistentes?", "question": "Si quieres que varie menos entre intentos, que ayuda mas?", "options": [{"text": "Dar instrucciones precisas y formato fijo", "correct": true, "reason": "Correcto: acotar reduce la variabilidad.", "points": 20}, {"text": "Repetir la pregunta a secas", "correct": false, "reason": "Sin mas precision, seguira variando.", "points": 0}, {"text": "Pedir que sea creativo", "correct": false, "reason": "Eso aumenta la variabilidad, no la reduce.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: el termino clave", "instruction": "Como se llama cuando Claude responde con seguridad algo que es falso? (una palabra)", "answer": "alucinacion", "hint": "Se llama alucinacion (hallucination).", "points": 25}, {"type": "challenge", "title": "Reto: unidad de texto", "instruction": "Como se llama el trozo de texto (~4 caracteres) que Claude procesa? (una palabra)", "answer": "token", "hint": "Claude procesa el texto en tokens.", "points": 25}, {"type": "matching_game", "title": "Como razona Claude", "pairs": [{"left": "Genera por", "right": "Probabilidad", "points": 15}, {"left": "Token", "right": "Trozo de texto", "points": 15}, {"left": "Context window", "right": "Memoria de trabajo", "points": 15}, {"left": "Alucinacion", "right": "Seguro pero falso", "points": 15}, {"left": "Mejor en complejo", "right": "Paso a paso", "points": 15}]}, {"type": "content", "title": "Resumen de la leccion", "text": "• Claude predice texto, no lo consulta: es autocompletado muy potente\n• Procesa tokens y recuerda dentro del context window\n• Puede alucinar: verifica datos criticos pese al tono seguro\n• Razona mejor paso a paso y varia entre intentos\n• Tiene fecha de corte: aporta tu el contexto reciente o privado\n\nEntender esto te convierte en alguien que GUIA al modelo en vez de pelearse con el.", "points": 10}, {"type": "badge", "name": "🧠 Mente de Claude", "description": "Entiendes como razona Claude: prediccion, tokens, contexto, alucinaciones y razonamiento."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m1l3') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m1l3', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 1 - Lección 3</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #3B82F644';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
