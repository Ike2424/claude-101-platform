<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L6-2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #EA580C; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #EA580C; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #EA580C, #EA580Cdd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #EA580C, #EA580Cdd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #EA580C66;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #EA580C;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #EA580C; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #EA580C; background: ##EA580C11; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #EA580C, #EA580Cdd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #EA580C33;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #EA580C; box-shadow: 0 0 0 3px #EA580C11; }
        
        button { 
            background: linear-gradient(135deg, #EA580C, #EA580Cdd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #EA580C44; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##EA580C11; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #EA580C; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #EA580C; background: ##EA580C11; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M6 • L2 • Casos de uso</div>
                <div class="title">Módulo 6 - Lección 2</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Claude como copiloto de codigo", "text": "Claude ayuda en todo el ciclo: escribir funciones, explicar codigo ajeno, encontrar bugs, escribir tests y refactorizar.\n\nFunciona mejor cuando le das contexto: lenguaje, version, que hace el codigo y que esperas.", "points": 10}, {"type": "content", "title": "Pedir codigo que sirva", "text": "• Indica lenguaje y version\n• Describe la entrada y la salida esperada\n• Menciona restricciones (librerias permitidas, rendimiento)\n• Pide comentarios y manejo de errores si lo necesitas", "points": 10}, {"type": "example", "title": "Debugging con contexto", "code": "Lenguaje: Python 3.11\nEsta funcion deberia devolver la lista sin duplicados manteniendo el orden,\npero a veces los pierde. Pega el codigo + un caso que falla.\n\nPide: 'Explica la causa y dame la version corregida con un test.'", "points": 15}, {"type": "content", "title": "Explicar y aprender", "text": "Pega codigo que no entiendas y pide:\n• \"Explicalo linea por linea\"\n• \"Que hace esta funcion y por que?\"\n• \"Hay riesgos de seguridad aqui?\"\n\nEs una forma rapida de entender bases de codigo nuevas.", "points": 10}, {"type": "content", "title": "Buenas practicas al programar con IA", "text": "• Revisa SIEMPRE el codigo antes de ejecutarlo\n• Prueba con casos limite\n• No pegues secretos (claves, tokens) en el prompt\n• Pide tests para validar el comportamiento", "points": 10}, {"type": "interactive_quiz", "title": "Que dato ayuda mas a depurar?", "question": "Al pedir ayuda con un bug, que es lo mas util incluir junto al codigo?", "options": [{"text": "Tu opinion sobre el lenguaje", "correct": false, "reason": "No aporta al diagnostico.", "points": 0}, {"text": "El error real y el resultado esperado", "correct": true, "reason": "Correcto: comparar esperado vs real permite localizar la causa.", "points": 20}, {"text": "La hora a la que fallo", "correct": false, "reason": "Irrelevante para el bug en si.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: buena practica", "instruction": "Antes de ejecutar codigo generado por IA, que deberias hacer siempre? (una palabra que empieza por R)", "answer": "revisar", "hint": "Revisarlo: nunca ejecutes a ciegas codigo generado.", "points": 25}, {"type": "matching_game", "title": "Programar con Claude", "pairs": [{"left": "Escribir", "right": "Da lenguaje y E/S", "points": 15}, {"left": "Depurar", "right": "Error esperado vs real", "points": 15}, {"left": "Entender", "right": "Explicar linea a linea", "points": 15}, {"left": "Seguridad", "right": "No pegar secretos", "points": 15}]}, {"type": "content", "title": "No hace falta ser programador", "text": "Aunque no programes, Claude te ayuda con lo tecnico:\n\n• Escribir formulas de Excel/Sheets\n• Automatizar tareas repetitivas con pequenos scripts\n• Entender un error que te aparecio\n• Explicarte que hace un trozo de codigo\n\nEs como tener un programador paciente al lado que ademas te explica.", "points": 10}, {"type": "content", "title": "Escribir tests para validar", "text": "Una practica de oro: pedir tests junto al codigo.\n\n'Dame la funcion y ademas 3 pruebas que confirmen que funciona, incluido un caso limite.'\n\nLos tests son tu red de seguridad: demuestran que el codigo hace lo que dice, en vez de fiarte a ciegas.", "points": 10}, {"type": "content", "title": "Refactor y mejora", "text": "Claude no solo arregla, tambien mejora codigo existente:\n\n• 'Hazlo mas legible'\n• 'Separa esta funcion en partes mas pequenas'\n• 'Hay riesgos de seguridad aqui?'\n• 'Optimiza esta parte lenta'\n\nPega tu codigo y pide la mejora concreta que necesitas.", "points": 10}, {"type": "example", "title": "Pedir codigo con red de seguridad", "code": "Lenguaje: Python 3.11\nTarea: funcion que valide si un email tiene formato correcto.\nRequisitos:\n- Comentarios explicando la logica\n- Manejo de entrada vacia\n- 3 tests: uno valido, uno invalido, uno vacio", "points": 15}, {"type": "interactive_quiz", "title": "Por que pedir tests junto al codigo?", "question": "Cual es la razon principal?", "options": [{"text": "Para confirmar que el codigo hace lo que dice", "correct": true, "reason": "Correcto: los tests validan el comportamiento.", "points": 20}, {"text": "Para que el codigo sea mas largo", "correct": false, "reason": "No se trata de longitud.", "points": 0}, {"text": "Para gastar mas tokens", "correct": false, "reason": "El objetivo es seguridad, no gasto.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen de la leccion", "text": "• Claude ayuda en todo el ciclo: escribir, depurar, explicar, mejorar\n• Da contexto: lenguaje, entrada/salida, error real\n• Pide tests como red de seguridad\n• Revisa siempre antes de ejecutar y no pegues secretos\n\nSiguiente: analisis de datos y documentos.", "points": 10}, {"type": "badge", "name": "💻 Copiloto Tecnico", "description": "Sabes usar Claude para escribir, depurar y entender codigo de forma segura."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m6l2') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m6l2', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 6 - Lección 2</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #EA580C44';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        function _normAns(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value;
            const accepted = String(answer).split(/\s+o\s+/i).map(_normAns).filter(Boolean);
            if (accepted.includes(_normAns(userAnswer))) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
