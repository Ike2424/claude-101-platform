<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L4-4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #F59E0B;
            --bg: #ffffff;
            --text: #1f2937;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.2s; }
        .lesson { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 12px; }
        .progress { height: 2px; background: #e5e7eb; margin-bottom: 12px; }
        [data-theme="dark"] .progress { background: #1e293b; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .header { text-align: center; margin-bottom: 12px; }
        .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary); font-weight: 600; }
        .title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: #6b7280; }
        .slides { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .flip-card { width: 90%; max-width: 300px; height: 200px; cursor: pointer; perspective: 1000px; }
        .flip-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; border-radius: 8px; text-align: center; }
        .flip-front { background: var(--primary); color: white; }
        .flip-front .concept { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .flip-front .hint { font-size: 11px; opacity: 0.9; }
        .flip-back { background: white; color: var(--text); border: 1px solid #e5e7eb; transform: rotateY(180deg); }
        [data-theme="dark"] .flip-back { background: #1e293b; border-color: #334155; }
        .flip-back h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
        .flip-back ul { text-align: left; font-size: 12px; line-height: 1.5; }
        .flip-back li { margin: 4px 0; padding-left: 12px; position: relative; }
        .flip-back li:before { content: "•"; position: absolute; left: 0; color: var(--primary); }
        .quiz { width: 90%; max-width: 320px; }
        .quiz-q { font-size: 13px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
        .quiz-opt { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-size: 12px; background: white; color: var(--text); transition: 0.2s; }
        [data-theme="dark"] .quiz-opt { background: #1e293b; border-color: #334155; }
        .quiz-opt:hover { border-color: var(--primary); background: #f0f9ff; }
        [data-theme="dark"] .quiz-opt:hover { background: #1e293b; }
        .quiz-opt.correct { border-color: #10b981; background: #ecfdf5; color: #047857; }
        [data-theme="dark"] .quiz-opt.correct { background: #064e3b; color: #6ee7b7; }
        .quiz-opt.incorrect { border-color: #ef4444; background: #fef2f2; color: #dc2626; }
        [data-theme="dark"] .quiz-opt.incorrect { background: #7f1d1d; color: #fca5a5; }
        .quiz-feedback { font-size: 11px; margin-top: 8px; display: none; font-weight: 500; }
        .quiz-feedback.show { display: block; }
        .conclusion { text-align: center; }
        .conclusion .check { font-size: 40px; margin-bottom: 8px; animation: bounce 0.6s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .conclusion h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .conclusion p { font-size: 12px; color: #6b7280; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid #e5e7eb; }
        [data-theme="dark"] .nav { border-color: #334155; }
        .nav button { background: none; border: 1px solid #e5e7eb; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; color: var(--text); transition: 0.2s; }
        [data-theme="dark"] .nav button { border-color: #334155; }
        .nav button:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .counter { font-size: 11px; color: #6b7280; }
        .theme-btn { background: none; border: none; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <div class="lesson">
        <div class="progress"><div class="progress-fill"></div></div>
        <div class="header">
            <div class="eyebrow" id="eyebrow"></div>
            <div class="title" id="title"></div>
            <div class="subtitle" id="subtitle"></div>
        </div>
        <div class="slides" id="slides"></div>
        <div class="nav">
            <button class="prev-btn">← Anterior</button>
            <span class="counter"><span id="slide-num">1</span> / <span id="slide-total">10</span></span>
            <button class="theme-btn">☀️</button>
            <button class="next-btn">Siguiente →</button>
        </div>
    </div>
    <script>
        const slideData = [{"type": "intro"}, {"type": "flip", "front": "Tema 1", "title": "Sobre Iteraci\u00f3n", "back": ["Punto principal", "Detalle clave", "Aplicaci\u00f3n"]}, {"type": "quiz", "question": "\u00bfCu\u00e1l es el concepto de Iteraci\u00f3n?", "options": ["Opci\u00f3n A", "\u2713 Iteraci\u00f3n", "Opci\u00f3n C"], "correct": 1}, {"type": "flip", "front": "Tema 2", "title": "C\u00f3mo usar", "back": ["M\u00e9todo 1", "M\u00e9todo 2", "Mejores pr\u00e1cticas"]}, {"type": "quiz", "question": "\u00bfCu\u00e1ndo aplicar Iteraci\u00f3n?", "options": ["Solo teor\u00eda", "\u2713 En proyectos reales", "Nunca"], "correct": 1}, {"type": "flip", "front": "Tema 3", "title": "Casos de uso", "back": ["Caso 1", "Caso 2", "Ventajas"]}, {"type": "quiz", "question": "\u00bfCu\u00e1l es la ventaja principal?", "options": ["Rapidez", "\u2713 Mejor calidad", "Bajo costo"], "correct": 1}, {"type": "end"}];
        const lessonInfo = {"title": "Iteraci\u00f3n", "description": "Refinamiento", "eyebrow": "M4 \u2022 L4"};
        let currentSlide = 0;

        function render() {
            const slide = slideData[currentSlide];
            const container = document.getElementById('slides');
            let html = '';

            if (slide.type === 'intro') {
                html = `<div class="header"><div style="font-size: 14px; color: #6b7280;">Refinamiento</div><div style="font-size: 20px; font-weight: 700; margin-top: 8px;">Iteración</div></div>`;
            } else if (slide.type === 'flip') {
                html = `<div class="flip-card"><div class="flip-inner"><div class="flip-front"><div class="concept">${slide.front}</div><div class="hint">Click para voltear</div></div><div class="flip-back"><h3>${slide.title}</h3><ul>${slide.back.map(b => `<li>${b}</li>`).join('')}</ul></div></div></div>`;
            } else if (slide.type === 'quiz') {
                html = `<div class="quiz"><div class="quiz-q">${slide.question}</div><div class="quiz-opts">${slide.options.map((o, i) => `<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}</div><div class="quiz-feedback"></div></div>`;
            } else if (slide.type === 'end') {
                html = `<div class="conclusion"><div class="check">✓</div><h2>Completado</h2><p>Lección terminada</p></div>`;
            }

            container.innerHTML = html;
            updateUI();
            attachEvents();
        }

        function updateUI() {
            const prog = ((currentSlide + 1) / slideData.length) * 100;
            document.querySelector('.progress-fill').style.width = prog + '%';
            document.getElementById('slide-num').textContent = currentSlide + 1;
            document.getElementById('slide-total').textContent = slideData.length;
            document.getElementById('eyebrow').textContent = lessonInfo.eyebrow;
            document.getElementById('title').textContent = lessonInfo.title;
            document.getElementById('subtitle').textContent = lessonInfo.description;
        }

        function attachEvents() {
            const flipCard = document.querySelector('.flip-card');
            if (flipCard) {
                flipCard.addEventListener('click', () => {
                    flipCard.classList.toggle('flipped');
                });
            }

            const quizOpts = document.querySelectorAll('.quiz-opt');
            quizOpts.forEach(opt => {
                opt.addEventListener('click', () => {
                    if (opt.classList.contains('correct') || opt.classList.contains('incorrect')) return;
                    const isCorrect = parseInt(opt.dataset.i) === slideData[currentSlide].correct;
                    const feedback = document.querySelector('.quiz-feedback');
                    if (isCorrect) {
                        opt.classList.add('correct');
                        feedback.textContent = '✓ ¡Correcto!';
                        feedback.style.color = '#047857';
                    } else {
                        opt.classList.add('incorrect');
                        feedback.textContent = '✗ Incorrecto';
                        feedback.style.color = '#dc2626';
                    }
                    feedback.classList.add('show');
                    quizOpts.forEach(o => o.style.pointerEvents = 'none');
                });
            });
        }

        document.querySelector('.prev-btn').addEventListener('click', () => {
            if (currentSlide > 0) currentSlide--;
            render();
        });

        document.querySelector('.next-btn').addEventListener('click', () => {
            if (currentSlide < slideData.length - 1) currentSlide++;
            render();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentSlide > 0) { currentSlide--; render(); }
            if (e.key === 'ArrowRight' && currentSlide < slideData.length - 1) { currentSlide++; render(); }
        });

        document.querySelector('.theme-btn').addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });

        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        render();
    </script>
</body>
</html>
