<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L9-1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #7C3AED; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #7C3AED; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #7C3AED, #7C3AEDdd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #7C3AED, #7C3AEDdd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #7C3AED66;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #7C3AED;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #7C3AED; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #7C3AED; background: ##7C3AED11; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #7C3AED, #7C3AEDdd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #7C3AED33;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #7C3AED; box-shadow: 0 0 0 3px #7C3AED11; }
        
        button { 
            background: linear-gradient(135deg, #7C3AED, #7C3AEDdd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #7C3AED44; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##7C3AED11; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #7C3AED; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #7C3AED; background: ##7C3AED11; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M9 • L1 • Avanzado</div>
                <div class="title">Módulo 9 - Lección 1</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/15</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "La filosofia detras de Claude", "text": "Claude se disena para ser util, honesto e inofensivo.\n\nEn la practica esto se nota: tiende a razonar los matices en vez de bloquear cualquier tema sensible, y reconoce lo que no sabe en lugar de proyectar falsa certeza.", "points": 10}, {"type": "content", "title": "Que es Constitutional AI", "text": "Constitutional AI es un metodo de entrenamiento donde el modelo aprende a seguir un conjunto de principios (una 'constitucion') para autoevaluar y mejorar sus respuestas.\n\nEn vez de depender solo de etiquetas humanas, el modelo critica y revisa sus salidas segun esos principios.", "points": 10}, {"type": "content", "title": "Por que te importa como usuario", "text": "• Respuestas mas matizadas en temas delicados\n• Menos rechazos automaticos sin sentido\n• Mayor honestidad sobre incertidumbre\n\nEntender esta filosofia te ayuda a pedir mejor y a interpretar por que responde como responde.", "points": 10}, {"type": "content", "title": "Honestidad calibrada", "text": "Claude tiende a:\n• Admitir cuando no sabe algo\n• Senalar suposiciones\n• Evitar inventar con falsa seguridad\n\nPuedes potenciarlo pidiendo explicitamente nivel de confianza o que distinga hecho de opinion.", "points": 10}, {"type": "interactive_quiz", "title": "Que es Constitutional AI?", "question": "Cual descripcion encaja mejor?", "options": [{"text": "Un modelo entrenado con un conjunto de principios para autoevaluarse", "correct": true, "reason": "Correcto: aprende a seguir y aplicar una 'constitucion' de principios.", "points": 20}, {"text": "Una ley de internet", "correct": false, "reason": "No es legislacion; es un metodo de entrenamiento.", "points": 0}, {"text": "Un tipo de hardware", "correct": false, "reason": "No tiene que ver con hardware.", "points": 0}], "points": 20}, {"type": "challenge", "title": "Reto: los 3 valores", "instruction": "Claude se disena para ser util, honesto e ___. (una palabra)", "answer": "inofensivo", "hint": "Util, honesto e inofensivo (helpful, honest, harmless).", "points": 25}, {"type": "matching_game", "title": "Diseno de Claude", "pairs": [{"left": "Constitutional AI", "right": "Principios para autoevaluar", "points": 15}, {"left": "Util", "right": "Resuelve tareas", "points": 15}, {"left": "Honesto", "right": "Reconoce limites", "points": 15}, {"left": "Inofensivo", "right": "Evita el dano", "points": 15}]}, {"type": "content", "title": "Como funciona, en simple", "text": "Constitutional AI, paso a paso:\n\n1. Se define un conjunto de principios (la 'constitucion')\n2. El modelo genera una respuesta\n3. Se critica a si mismo segun esos principios\n4. Reescribe la respuesta mejorada\n\nEn vez de depender solo de etiquetas humanas, el modelo aprende a autoevaluarse con esos principios.", "points": 10}, {"type": "content", "title": "Util, honesto, inofensivo", "text": "Los tres valores guia, con ejemplos de lo que provocan:\n\n🤝 Util: se esfuerza en resolver tu tarea de verdad\n📝 Honesto: reconoce lo que no sabe, no inventa para complacer\n🛡️ Inofensivo: evita causar dano real\n\nEl reto del diseno es equilibrarlos: ser util sin dejar de ser seguro, y honesto sin ser inutilmente rigido.", "points": 10}, {"type": "content", "title": "Por que importa para ti", "text": "Esta filosofia explica comportamientos que notaras:\n\n• Razona los matices en temas delicados en vez de bloquear\n• Te dice cuando no esta seguro\n• Intenta ayudar de verdad, no solo cumplir\n\nSaberlo te ayuda a pedir mejor: si quieres mas honestidad sobre incertidumbre, pidela explicitamente.", "points": 10}, {"type": "example", "title": "Ver la honestidad calibrada en accion", "code": "Compara estos dos prompts y observa la diferencia:\n\n1. 'Dame el dato exacto de X' (puede arriesgar)\n\n2. 'Dame el dato de X. Si no estas seguro, dimelo y\n   explica que harias para verificarlo.' (invita a la honestidad)", "points": 15}, {"type": "interactive_quiz", "title": "Que es Constitutional AI?", "question": "Cual descripcion encaja mejor?", "options": [{"text": "Un modelo que se autoevalua con un conjunto de principios", "correct": true, "reason": "Correcto: aprende a aplicar una 'constitucion' de principios.", "points": 20}, {"text": "Una ley de internet", "correct": false, "reason": "No es legislacion; es un metodo de entrenamiento.", "points": 0}, {"text": "Un tipo de hardware", "correct": false, "reason": "No tiene que ver con hardware.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen de la leccion", "text": "• Claude se disena para ser util, honesto e inofensivo\n• Constitutional AI le ensena a autoevaluarse con principios\n• Esto explica el matiz y la honestidad que notaras\n• Puedes potenciar esa honestidad pidiendola explicitamente\n\nSiguiente: Markdown como input estructurado.", "points": 10}, {"type": "badge", "name": "🏛️ Conocedor del Diseno", "description": "Entiendes la filosofia de Claude y Constitutional AI."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m9l1') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m9l1', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 9 - Lección 1</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #7C3AED44';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value.trim();
            if (userAnswer.toLowerCase() === answer.toLowerCase()) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
