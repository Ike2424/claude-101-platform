<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude 101 · L2-4</title><style>:root{--bg:#F4EFE3;--bg-2:#EFE9DA;--card:#FBF8F0;--ink:#1C1A16;--ink-2:#3A352D;--muted:#756B5B;--line:#E1D8C2;--accent:#C8542B;--olive:#4F5D38;}*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;overflow:hidden;}body{display:flex;flex-direction:column;}button{cursor:pointer;border:none;transition:.2s;}button:hover{transform:translateY(-2px)}.header{flex-shrink:0;display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(251,248,240,.7);}.exit-btn{background:0;border:1px solid #ccc;color:var(--ink-2);font-family:monospace;padding:7px 12px;border-radius:100px;cursor:pointer;}.exit-btn:hover{border-color:var(--accent);color:var(--accent);}.brand{font-family:Fraunces;font-style:italic;}.brand em{color:var(--accent);}.stage{flex:1;position:relative;overflow:hidden;}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transform:scale(.95);transition:all .5s cubic-bezier(.2,.8,.2,1);overflow-y:auto;}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);}.slide-inner{width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;}.eyebrow{font-family:monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);}.title{font-family:Fraunces;font-size:clamp(32px,6vw,56px);line-height:1.1;font-weight:400;}.title em{font-style:italic;color:var(--accent);}.subtitle{font-size:18px;color:var(--muted);line-height:1.5;}.slide-text{font-size:12px;color:var(--ink-2);line-height:1.5;max-width:600px;margin-top:8px;word-wrap:break-word;overflow-wrap:break-word;white-space:normal;hyphens:auto;}.intro-icon{font-size:48px;animation:bounce 2s infinite;}.flip-card{cursor:pointer;perspective:1000px;height:280px;width:100%;max-width:500px;}.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;}.flip-card.flipped .flip-inner{transform:rotateY(180deg);}.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);overflow-y:auto;max-height:280px;}.flip-back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(79,93,56,.1),rgba(200,84,43,.1));border-color:var(--accent);}.flip-front p,.flip-back p{font-size:11px;font-weight:500;color:var(--ink);word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;margin:0;}.flip-front small,.flip-back small{font-size:10px;color:var(--muted);margin-top:8px;}.quiz-question{font-size:16px;color:var(--ink);margin-bottom:12px;font-weight:500;}.quiz-options{display:flex;flex-direction:column;gap:8px;width:100%;max-width:550px;}.quiz-option{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;font-size:11px;cursor:pointer;word-wrap:break-word;overflow-wrap:break-word;}.quiz-option:hover{border-color:var(--accent);transform:translateX(2px);}.quiz-option.correct{background:rgba(79,93,56,.15);border-color:var(--olive);}.quiz-option.wrong{background:rgba(200,84,43,.15);border-color:var(--accent);}.option-letter{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:white;font-weight:600;flex-shrink:0;font-size:11px;}.option-text{flex:1;word-wrap:break-word;overflow-wrap:break-word;}.check-mark{opacity:0;transition:.3s;}.quiz-option.answered .check-mark{opacity:1;}.quiz-feedback{margin-top:8px;padding:8px 10px;background:var(--card);border-left:4px solid var(--olive);border-radius:6px;font-size:11px;word-wrap:break-word;line-height:1.3;}.quiz-feedback.hidden{display:none;}.quiz-feedback.show{display:block;animation:slideIn .3s ease;}.key-title{font-size:16px;color:var(--ink);margin-bottom:10px;font-weight:500;}.key-list{list-style:none;padding:0;text-align:left;max-width:550px;margin:0 auto;}.key-list li{background:rgba(79,93,56,.05);border-left:4px solid var(--olive);padding:8px 10px;margin:4px 0;border-radius:4px;font-size:11px;color:var(--ink-2);word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;}.footer{flex-shrink:0;display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);}.nav-btn{background:var(--card);border:1px solid #ccc;color:var(--ink-2);padding:7px 12px;border-radius:100px;cursor:pointer;font-size:11px;}.nav-btn:hover{border-color:var(--accent);color:var(--accent);}.nav-btn.primary{background:var(--accent);color:white;}.nav-btn.disabled{opacity:.5;pointer-events:none;}.progress-dots{display:flex;gap:4px;}.progress-dot{width:4px;height:4px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s;}.progress-dot.active{background:var(--accent);width:14px;border-radius:2px;}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}</style></head><body>PE html>
