c no entrena con tus conversaciones por defecto. Hay un control específico — si lo dejas activado, ayudas a mejorar. Si quieres confidencialidad estricta (cliente, código propietario), revisa que esté desactivado."}, {"type": "scenarios", "title": "Buen <em>perfil</em>", "list": [{"text": "\"Soy abogada laboralista en Madrid, llevo 8 años, escribo informes para clientes corporativos y prefiero respuestas en bullets cortos con referencias a normativa española.\"", "options": ["Demasiado largo, mejor \"soy abogada\"", "Perfecto: rol + experiencia + audiencia + formato", "Falta poner el DNI"], "correct": 1, "feedback": "Es excelente: define rol, sector, experiencia, audiencia y formato preferido. Cada conversación parte con ese contexto y la calidad sube."}, {"text": "\"Soy desarrollador.\"", "options": ["Suficiente", "Demasiado vago — ¿stack? ¿nivel? ¿en qué trabajas?", "Sobra"], "correct": 1, "feedback": "Muy vago. \"Soy desarrollador Python senior en una fintech, trabajo en backend de pagos\" es mucho más útil — Claude calibra ejemplos, vocabulario y profundidad."}, {"text": "\"Mi número de teléfono es +34 600 123 456 y mi DNI...\"", "options": ["Buena idea por si acaso", "NO — no compartas datos sensibles en el perfil", "Solo el teléfono"], "correct": 1, "feedback": "No. El perfil es para contexto de uso, no para datos personales sensibles. Esos no aportan calidad y aumentan riesgo."}]}, {"type": "recap", "list": [{"q": "Si trabajas con datos de clientes, ¿qué revisas SÍ o SÍ?", "options": ["El modelo", "La opción de privacidad/entrenamiento — desactívala", "El idioma"], "correct": 1, "explain": "En contextos con datos de terceros (clientes, pacientes, empleados), desactiva el opt-in de entrenamiento."}, {"q": "¿Por qué rellenar el perfil personal con tu rol y preferencias?", "options": ["Para conseguir descuentos", "Porque Claude ajusta nivel, ejemplos y formato — calidad de respuestas sube", "Es obligatorio"], "correct": 1, "explain": "Es lo más rentable: 5 minutos una vez = mejores respuestas en todas las conversaciones siguientes."}]}, {"type": "final", "title": "Listo para <em>operar</em>", "subtitle": "Acceso, interfaz, organización, configuración. Has terminado el M2. En M3: lo que más cambia tu uso de Claude — el arte del prompt.", "ctaLabel": "Marcar lección 2.4 completada →"}]};
