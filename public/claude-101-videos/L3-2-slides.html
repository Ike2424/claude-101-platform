<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3-2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%); color: #1f2937; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            padding: 16px 20px; background: white; border-bottom: 3px solid #A855F7; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .eyebrow { font-size: 12px; color: #A855F7; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .title { font-size: 20px; font-weight: 700; color: #1f2937; }
        .points-badge {
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        
        .progress-bar { 
            height: 6px; background: #e5e7eb; width: 100%; flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #A855F7, #A855F7dd);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px #A855F766;
        }
        
        .content { 
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
        }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #A855F7;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-title { font-size: 18px; color: #A855F7; margin-bottom: 12px; font-weight: 700; }
        .card-text { font-size: 14px; color: #374151; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }
        
        .code { 
            background: #1f2937; color: #d1d5db; padding: 14px; border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace; font-size: 12px;
            overflow-x: auto; margin: 12px 0; line-height: 1.5;
        }
        
        .quiz-option {
            padding: 12px 14px; margin: 10px 0;
            border: 2px solid #e5e7eb; border-radius: 8px;
            cursor: pointer; background: white; color: #1f2937; font-size: 14px;
            transition: all 0.2s; font-weight: 500;
        }
        .quiz-option:hover { border-color: #A855F7; background: ##A855F711; }
        .quiz-option.correct { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .quiz-option.incorrect { background: #fef2f2; border-color: #ef4444; color: #dc2626; }
        
        .feedback { 
            margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 500; display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #ecfdf5; color: #047857; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; }
        
        .badge { 
            text-align: center; padding: 30px;
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border-radius: 12px;
            box-shadow: 0 8px 16px #A855F733;
        }
        .badge-icon { font-size: 48px; margin-bottom: 12px; }
        .badge h3 { font-size: 20px; margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 10px 12px;
            border: 2px solid #e5e7eb; border-radius: 6px; 
            margin: 10px 0; font-family: inherit; font-size: 14px;
        }
        input:focus { outline: none; border-color: #A855F7; box-shadow: 0 0 0 3px #A855F711; }
        
        button { 
            background: linear-gradient(135deg, #A855F7, #A855F7dd);
            color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.2s; font-family: inherit; font-size: 14px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px #A855F744; }
        button:active { transform: translateY(0); }
        
        .nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: white; border-top: 1px solid #e5e7eb;
            flex-shrink: 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        .counter { font-size: 13px; color: #6b7280; font-weight: 600; }
        
        .instruction { 
            background: ##A855F711; padding: 12px 14px; border-radius: 6px;
            margin-bottom: 12px; font-size: 14px; color: #A855F7; font-weight: 500;
        }
        
        .matching-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .match-item {
            padding: 12px; background: white; border: 2px solid #e5e7eb;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-weight: 500; font-size: 13px;
        }
        .match-item:hover { border-color: #A855F7; background: ##A855F711; }
        .match-item.matched { background: #ecfdf5; border-color: #10b981; color: #047857; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="header">
        <div class="header-left">
            <div>
                <div class="eyebrow">M3 • L2 • Prompting</div>
                <div class="title">Módulo 3 - Lección 2</div>
            </div>
        </div>
        <div class="points-badge" id="total-points">0 pts</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">
        <button id="prev">← Anterior</button>
        <span class="counter"><span id="cnt">1</span>/16</span>
        <button id="next">Siguiente →</button>
    </div>
    
    <script>
        const slides = [{"type": "intro", "points": 0}, {"type": "content", "title": "Mas contexto, mejores respuestas", "text": "El contexto es la informacion de fondo que Claude necesita para responder bien.\n\nSin contexto, Claude usa supuestos genericos. Con contexto, ajusta el tono, el nivel tecnico y el enfoque a TU situacion.\n\nTipos de contexto utiles:\n• Quien eres tu y quien es la audiencia\n• El objetivo real detras de la tarea\n• Restricciones (longitud, tono, lo que NO quieres)\n• Ejemplos de lo que consideras bueno", "points": 10}, {"type": "content", "title": "Claridad: una idea, una instruccion", "text": "La claridad evita que Claude interprete mal.\n\n• Usa lenguaje directo, no rodeos\n• Una tarea principal por prompt\n• Evita palabras ambiguas como \"mejoralo\" sin decir en que sentido\n• Si hay pasos, numeralos\n\nAmbiguo: \"Hazlo mas profesional\"\nClaro: \"Reemplaza el lenguaje coloquial por terminos formales y quita las exclamaciones\"", "points": 10}, {"type": "content", "title": "Especificidad: el nivel de detalle correcto", "text": "Ser especifico no es escribir mas, es escribir lo que importa.\n\nVariables que conviene fijar:\n• Longitud: \"3 frases\", \"200 palabras\", \"1 pagina\"\n• Audiencia: \"para directivos sin perfil tecnico\"\n• Tono: \"cercano\", \"neutro\", \"academico\"\n• Estructura: \"intro, 3 puntos y cierre\"\n\nCada variable que fijas reduce el rango de respuestas posibles.", "points": 10}, {"type": "example", "title": "Antes y despues con contexto", "code": "# Antes (poco contexto)\nEscribe un correo de disculpa al cliente.\n\n# Despues (con contexto)\nContexto: somos una tienda online; el pedido llego 5 dias tarde\npor un error nuestro de logistica. El cliente es recurrente.\n\nTarea: escribe un correo de disculpa.\nTono: sincero, sin excusas, ofreciendo un 15% de descuento.\nFormato: max 120 palabras, con asunto.", "points": 15}, {"type": "interactive_quiz", "title": "Elige la version mas clara", "question": "Cual instruccion dara resultados mas predecibles?", "options": [{"text": "Hazme un resumen bonito", "correct": false, "reason": "\"Bonito\" es subjetivo; no define longitud ni formato.", "points": 0}, {"text": "Resume en 5 vinetas, una frase cada una, para un lector sin tiempo", "correct": true, "reason": "Correcto: define formato, longitud y audiencia.", "points": 20}, {"text": "Resume eso", "correct": false, "reason": "No dice como ni para quien.", "points": 0}], "points": 20}, {"type": "content", "title": "El peligro de los supuestos", "text": "Claude rellena los huecos con supuestos razonables, pero pueden no ser los tuyos.\n\nEjemplos de huecos comunes:\n• Idioma de la respuesta\n• Publico objetivo\n• Nivel de formalidad\n• Si quieres explicacion o solo el resultado\n\nSolucion: explicita lo que para ti es obvio. El modelo no esta en tu cabeza.", "points": 10}, {"type": "challenge", "title": "Reto: anade especificidad", "instruction": "Que palabra clave falta en \"Escribe un post\" para fijar el canal? (responde con UNA palabra que indique donde se publica, ej: para LinkedIn)", "answer": "LinkedIn", "hint": "Cualquier red/plataforma vale como ejemplo; lo que importa es fijar el canal/audiencia.", "points": 25}, {"type": "matching_game", "title": "Vago vs especifico", "pairs": [{"left": "\"Hazlo corto\"", "right": "Ambiguo", "points": 15}, {"left": "\"Max 100 palabras\"", "right": "Especifico", "points": 15}, {"left": "\"Tono pro\"", "right": "Ambiguo", "points": 15}, {"left": "\"Formal, sin jerga\"", "right": "Especifico", "points": 15}]}, {"type": "content", "title": "Contexto explicito vs implicito", "text": "Hay contexto que tu tienes en la cabeza (implicito) y que Claude no puede ver. Tu trabajo es hacerlo explicito.\n\nImplicito (en tu cabeza): 'es para mi jefe, que odia los rodeos'.\nExplicito (en el prompt): 'el lector es un directivo que valora la brevedad'.\n\nCada vez que algo es 'obvio para ti', preguntate si esta escrito. Si no lo esta, Claude no lo sabe.", "points": 10}, {"type": "content", "title": "La escalera de la especificidad", "text": "Sube peldanos hasta que la respuesta no tenga escapatoria:\n\n1. 'Escribe un resumen' (vago)\n2. 'Resume en 5 puntos' (mejor)\n3. 'Resume en 5 puntos para un directivo' (audiencia)\n4. '...destacando riesgos y decisiones' (foco)\n\nCada peldano elimina interpretaciones posibles y te acerca a lo que querias.", "points": 10}, {"type": "content", "title": "Demasiado contexto tambien estorba", "text": "Ojo: especificidad no es escribir un testamento.\n\n• Incluye lo que cambia la respuesta\n• Quita el relleno que no aporta\n• Un dato irrelevante puede despistar tanto como la falta de datos\n\nEl objetivo es contexto UTIL, no contexto largo. Calidad sobre cantidad.", "points": 10}, {"type": "example", "title": "Mismo encargo, 3 niveles de contexto", "code": "Nivel 1: Traduce esto.\n\nNivel 2: Traduce esto al ingles.\n\nNivel 3: Traduce esto al ingles britanico, tono formal,\nes para un email a un cliente corporativo. Manten los\nnombres propios sin traducir.\n\nEl nivel 3 casi no deja margen de error.", "points": 15}, {"type": "interactive_quiz", "title": "Que tipo de contexto falta mas a menudo?", "question": "Cual es el contexto que la gente olvida con mas frecuencia?", "options": [{"text": "La audiencia y el objetivo real", "correct": true, "reason": "Correcto: para quien y para que es lo que mas cambia la respuesta.", "points": 20}, {"text": "El color de fondo", "correct": false, "reason": "Irrelevante para un texto.", "points": 0}, {"text": "La marca del ordenador", "correct": false, "reason": "No influye en la tarea.", "points": 0}], "points": 20}, {"type": "content", "title": "Resumen de la leccion", "text": "• El contexto es lo que mas mueve la calidad de la respuesta\n• Haz explicito lo que para ti es obvio\n• Sube la escalera de especificidad hasta cerrar interpretaciones\n• Pero incluye solo contexto util, no relleno\n\nLo veras todo junto en la siguiente leccion con ejemplos antes/despues.", "points": 10}, {"type": "badge", "name": "🔍 Maestro del Contexto", "description": "Sabes dar contexto, claridad y especificidad para respuestas predecibles."}];
        let idx = 0;
        let totalPoints = parseInt(localStorage.getItem('total_points_m3l2') || '0');
        document.getElementById('total-points').textContent = totalPoints + ' pts';

        function updatePoints(p) {
            totalPoints += p;
            localStorage.setItem('total_points_m3l2', totalPoints);
            document.getElementById('total-points').textContent = totalPoints + ' pts';
        }

        function render() {
            const s = slides[idx];
            const c = document.getElementById('content');
            let html = '';

            if (s.type === 'intro') {
                html = '<div class="card" style="text-align: center; padding: 40px 20px;"><h2 style="font-size: 32px; margin: 20px 0;">Módulo 3 - Lección 2</h2><p style="color: #6b7280; font-size: 16px;">Toca siguiente para comenzar →</p></div>';
            } 
            else if (s.type === 'content') {
                html = '<div class="card"><div class="card-title">' + s.title + '</div><div class="card-text">' + s.text + '</div></div>';
            } 
            else if (s.type === 'example') {
                html = '<div class="card"><div class="card-title">📝 ' + s.title + '</div><div class="code">' + s.code + '</div></div>';
            } 
            else if (s.type === 'interactive_quiz') {
                html = '<div class="card"><div class="card-title">🎯 ' + s.title + '</div><div style="margin: 16px 0; font-weight: 500; color: #374151;">' + s.question + '</div><div>';
                s.options.forEach((opt, i) => {
                    html += '<button class="quiz-option" data-i="'+i+'">'+opt.text+'</button>';
                });
                html += '<div class="feedback" id="feedback"></div></div></div>';
                setTimeout(() => attachQuizListeners(s), 0);
            }
            else if (s.type === 'challenge') {
                html = '<div class="card"><div class="card-title">⚡ ' + s.title + '</div><div class="instruction">' + s.instruction + '</div><input type="text" id="answer" placeholder="Tu respuesta" /><button onclick="checkChallenge(\''+s.answer.replace(/'/g, "\\'")+'\', '+s.points+')">Verificar</button></div>';
            }
            else if (s.type === 'matching_game') {
                html = '<div class="card"><div class="card-title">🔗 ' + s.title + '</div><div class="matching-grid">';
                s.pairs.forEach((p, i) => {
                    html += '<div class="match-item" data-pair="'+i+'">' + p.left + '</div>';
                    html += '<div class="match-item" data-pair="'+i+'">' + p.right + '</div>';
                });
                html += '</div></div>';
                setTimeout(() => attachMatchingListeners(s), 0);
            }
            else if (s.type === 'badge') {
                html = '<div class="card badge"><div class="badge-icon">' + s.name.split(' ')[0] + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p></div>';
            }

            c.innerHTML = html;
            const p = ((idx + 1) / slides.length) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('cnt').textContent = idx + 1;
        }

        function attachQuizListeners(s) {
            document.querySelectorAll('.quiz-option').forEach(b => {
                b.addEventListener('click', () => {
                    const i = parseInt(b.dataset.i);
                    const opt = s.options[i];
                    const correct = opt.correct;
                    
                    document.querySelectorAll('.quiz-option').forEach(x => x.style.pointerEvents = 'none');
                    b.classList.add(correct ? 'correct' : 'incorrect');
                    
                    if (correct) updatePoints(opt.points || s.points);
                    
                    const fb = document.getElementById('feedback');
                    fb.textContent = opt.reason;
                    fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
                });
            });
        }

        function attachMatchingListeners(s) {
            const items = document.querySelectorAll('.match-item');
            let selected = null;
            let matched = 0;
            
            items.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (item.classList.contains('matched')) return;
                    
                    if (!selected) {
                        selected = item;
                        item.style.background = 'white';
                        item.style.boxShadow = '0 0 0 3px #A855F744';
                    } else {
                        const pair1 = parseInt(selected.dataset.pair);
                        const pair2 = parseInt(item.dataset.pair);
                        
                        if (pair1 === pair2) {
                            selected.classList.add('matched');
                            item.classList.add('matched');
                            updatePoints(s.pairs[pair1].points);
                            matched++;
                            if (matched === s.pairs.length) {
                                setTimeout(() => alert('¡Completado! 🎉'), 200);
                            }
                        } else {
                            selected.style.boxShadow = '';
                            selected.style.background = 'white';
                        }
                        selected = null;
                    }
                });
            });
        }

        window.checkChallenge = (answer, points) => {
            const userAnswer = document.getElementById('answer').value.trim();
            if (userAnswer.toLowerCase() === answer.toLowerCase()) {
                updatePoints(points);
                alert('✓ ¡Correcto! +' + points + ' puntos');
                if (idx < slides.length - 1) { idx++; render(); }
            } else {
                alert('✗ Incorrecto. Intenta de nuevo.');
            }
        }

        document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
        document.getElementById('next').addEventListener('click', () => { if (idx < slides.length - 1) { idx++; render(); } });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
            if (e.key === 'ArrowRight' && idx < slides.length - 1) { idx++; render(); }
        });

        setTimeout(() => render(), 0);
    </script>
</body>
</html>
