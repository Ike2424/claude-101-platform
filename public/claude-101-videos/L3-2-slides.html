window.MODULE_DATA = {"module": 3, "lessonId": "l3-2", "lessonNumber": "3.2", "title": "Contexto, claridad y especificidad", "slides": [{"type": "intro", "title": "Tu <em>nivel</em> de detalle", "subtitle": "En general, ¿cómo escribes prompts?", "chips": ["Muy cortos", "Cortos pero específicos", "Largos y detallados", "Depende del día", "No sé"]}, {"type": "choice", "eyebrow": "Pregunta 1", "title": "¿Cuál de estos da <em>mejor contexto</em>?", "prompt": "\"Escribe un email de seguimiento al cliente.\"", "options": ["\"Cliente que no respondió hace 10 días\"", "\"Cliente B2B SaaS que vio nuestra demo hace 10 días, dijo que necesitaba aprobación de su CTO, no ha vuelto a responder. Tono cercano, sin presión.\"", "\"Para un cliente.\"", "\"Un cliente importante.\""], "correct": 1, "feedback": "La opción 2. Contexto = quién, cuándo, qué pasó, qué barrera, qué tono. Cada uno de esos datos cambia el email."}, {"type": "reveal", "title": "Tres <em>palancas</em> de claridad", "prompt": "Toca cada una.", "items": [{"icon": "🎤", "name": "Audiencia", "tag": "Quién lee", "body": "Especificar a quién va dirigido cambia tono, vocabulario y profundidad. \"Para mi CEO\" ≠ \"para un compañero\" ≠ \"para clientes\". Una línea, gran diferencia."}, {"icon": "🧭", "name": "Objetivo", "tag": "Para qué", "body": "No basta con \"escribe X\" — añade para qué sirve. \"Para cerrar una venta\", \"para informar internamente\", \"para inspirar\". Define implícitamente lo que debe lograr el texto."}, {"icon": "🎚️", "name": "Especificidad", "tag": "Cuánto", "body": "Cuanto más concreta la petición, mejor. \"Máximo 80 palabras, 3 bullets, sin tecnicismos\" gana siempre a \"que sea conciso\"."}], "feedbackHead": "Bien.", "feedback": "Audiencia + objetivo + especificidad. Tres palancas. Si están en el prompt, la respuesta apunta mucho más cerca de lo que necesitas."}, {"type": "tf", "title": "Sobre <em>especificidad</em>", "statement": "\"Decir \"que sea breve\" funciona igual de bien que decir \"máximo 100 palabras en 3 bullets\".\"", "correct": false, "feedback": "Falso. \"Breve\" significa cosas distintas para cada persona — Claude interpretará a su criterio. \"Máximo 100 palabras en 3 bullets\" es un instructivo claro."}, {"type": "scenarios", "title": "Mejora estos <em>prompts</em>", "list": [{"text": "\"Hazme algo para el blog.\"", "options": ["Está bien", "Falta tipo de contenido, tema, audiencia, longitud, tono", "Falta solo el tema"], "correct": 1, "feedback": "\"Algo\" es invitación al caos. Define tipo (post, lista, tutorial), tema concreto, para quién y qué longitud."}, {"text": "\"Reescribe este texto.\"", "options": ["Está bien", "Falta dirección: ¿más formal? ¿más simple? ¿con bullets?", "Falta solo el formato"], "correct": 1, "feedback": "Reescribir hacia qué. Más formal, más conciso, en otro tono, dirigido a otra audiencia. Sin objetivo, Claude reescribirá \"como mejor le parezca\"."}, {"text": "\"Como editor de revista cultural, simplifica este texto académico para lectores no especializados (curiosos pero sin formación técnica). Máximo 400 palabras, tono cercano, mantén las tres ideas clave del original.\"", "options": ["Demasiado prescriptivo", "Excelente — rol, audiencia, longitud, tono y restricción", "Falta el tema"], "correct": 1, "feedback": "Modélico. Cada elemento útil: rol del editor, audiencia clara, restricción de longitud, tono y qué mantener."}]}, {"type": "recap", "list": [{"q": "¿Cómo darle contexto sin hacer el prompt eterno?", "options": ["Una frase por elemento: audiencia, objetivo, longitud, tono", "Escribir 3 páginas", "Solo lo mínimo"], "correct": 0, "explain": "Una frase corta por cada elemento. Suele caber todo en 4-5 líneas. Conciso pero específico."}, {"q": "¿Qué es lo más útil que puedes añadir al final de tu prompt?", "options": ["\"Por favor\"", "Una restricción clara: \"máximo X palabras, sin emojis, en castellano formal\"", "\"Gracias\""], "correct": 1, "explain": "Las restricciones acotan el output. Te ahorran iterar después."}]}, {"type": "final", "title": "Más contexto, menos <em>iteración</em>", "subtitle": "Cinco minutos pensando el prompt ahorran media hora iterando después. En la siguiente: antes y después con ejemplos reales.", "ctaLabel": "Marcar lección 3.2 completada →"}]};
