window.MODULE_DATA = {"module": 9, "lessonId": "l9-6", "lessonNumber": "9.6", "title": "Construye tu primer agente", "slides": [{"type": "intro", "title": "Listo para <em>construir</em>", "subtitle": "Has visto el concepto de agente. Ahora toca código. Toca lo que aplique para situarte.", "chips": ["Programo en Python", "Sé qué es una API key", "He llamado APIs antes", "Cero programación", "Aprendiendo a programar"]}, {"type": "choice", "eyebrow": "Pregunta 1", "title": "Qué necesitas para <em>empezar</em>", "prompt": "Para construir un agente funcional con Claude Agent SDK, ¿qué necesitas como mínimo?", "options": ["Una suscripción Pro de Claude.ai", "Python 3.10+, una API key de Anthropic, y ~30 minutos", "Conocer C++ y compilar el SDK", "Tener Claude Code instalado"], "correct": 1, "feedback": "Python + API key + tiempo. El SDK es un paquete pip normal. La API key se consigue en console.anthropic.com. Suscripciones de Claude.ai son para chat, no para construir."}, {"type": "reveal", "title": "Los <em>tres componentes</em>", "prompt": "Abre cada uno para entender qué hace.", "items": [{"icon": "🧰", "name": "Tools", "tag": "Acciones", "body": "Funciones Python normales que el agente puede ejecutar. leer_email(), enviar_respuesta(), etc. Tú las defines; el agente decide cuándo invocarlas."}, {"icon": "📋", "name": "Schemas", "tag": "Descripciones", "body": "JSON que describe cada tool: nombre, qué hace, qué parámetros acepta. La calidad de la descripción determina la calidad de las decisiones del agente."}, {"icon": "🔁", "name": "Bucle", "tag": "Control", "body": "El código que pide a Claude qué hacer, ejecuta su petición, le devuelve el resultado, y repite hasta que termine. Es el \"motor\" del agente."}], "feedbackHead": "Bien.", "feedback": "Tools + schemas + bucle. Con esos tres componentes tienes el patrón completo. El resto (modelo, system prompt, max_pasos) es configuración."}, {"type": "tf", "title": "Sobre las <em>descripciones</em>", "statement": "\"La descripción de una tool en su schema solo es para humanos que lean el código — no afecta a cómo el modelo la usa.\"", "correct": false, "feedback": "Falso. La descripción es CRÍTICA. Es lo que Claude lee para decidir cuándo y cómo usar la tool. Una descripción vaga lleva a decisiones erróneas; una específica guía decisiones acertadas."}, {"type": "scenarios", "title": "Decisiones <em>de diseño</em>", "list": [{"text": "\"Mi agente envía emails y tengo miedo de que mande algo inapropiado.\"", "options": ["Confiar y dejarle", "Cambiar la tool \"enviar\" por \"preparar_borrador\" + revisar manualmente", "No usar agentes"], "correct": 1, "feedback": "Patrón clásico: el agente propone, el humano aprueba. La tool guarda un borrador en lugar de enviar; tú revisas. Mantienes velocidad sin riesgo."}, {"text": "\"Mi agente lleva 30 pasos y sigue iterando sin terminar.\"", "options": ["Esperar", "Hay max_pasos=20 por defecto — tu agente está mal diseñado, revisa system prompt y descripciones", "Cambiar modelo"], "correct": 1, "feedback": "Bucle infinito = problema de diseño. Suele ser system prompt sin criterio claro de terminación, o tools con descripciones ambiguas que hacen que Claude no sepa cuándo ha terminado."}, {"text": "\"Mi agente cuesta 5€ por ejecución. Demasiado.\"", "options": ["Cambiar a Haiku ciegamente", "Mirar logs: cuántas llamadas, cuáles redundantes, mejorar tools para reducir pasos", "Subir el precio del producto"], "correct": 1, "feedback": "Casi siempre son llamadas redundantes. Mejora tools (consolidar en lugar de mil pequeñas), reduce max_pasos, considera Haiku si el caso es simple — pero diagnostica primero."}]}, {"type": "recap", "list": [{"q": "Acabas el tutorial. Tu siguiente paso lógico es...", "options": ["Leer otro tutorial", "Modificar el código para resolver UNA tarea repetitiva tuya real", "Ir a la fiesta"], "correct": 1, "explain": "Modificar para algo tuyo es donde se aprende de verdad. Cambia el system prompt y las tools por algo tuyo, ejecuta, ajusta. 30 minutos y ya sabes construir agentes."}, {"q": "¿Qué patrón usas cuando hay acciones irreversibles (enviar email, pagar)?", "options": ["Confías ciegamente", "Agente propone borrador, humano aprueba antes de ejecutar", "No usas agentes"], "correct": 1, "explain": "Propose-and-confirm. El agente prepara la acción, un humano la aprueba con un clic. Velocidad de agente, seguridad de revisión humana."}]}, {"type": "final", "title": "Ya <em>construyes</em>", "subtitle": "Has visto un agente real, en código, funcionando. El siguiente paso es modificarlo para una tarea tuya. Has terminado el módulo BONUS — y el curso entero.", "ctaLabel": "Marcar lección 9.6 completada →"}]};
