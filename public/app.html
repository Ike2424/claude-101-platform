<!DOCTYPE html>
<html lang="es">
<head>
<!-- Google Analytics 4 -->
<script src="/ga.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi curso · Claude 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4EFE3; --bg-2: #EFE9DA; --card: #FBF8F0;
  --ink: #1C1A16; --ink-2: #3A352D; --muted: #756B5B; --line: #E1D8C2; --line-2: #CFC4AA;
  --accent: #C8542B; --olive: #4F5D38;
  --display: 'Fraunces', Georgia, serif;
  --body: 'Geist', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); }
.app-bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  background: rgba(244,239,227,.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.app-brand { font-family: var(--display); font-style: italic; font-size: 18px; color: var(--ink); }
.app-brand em { font-style: normal; color: var(--accent); }
.app-user { display: flex; align-items: center; gap: 12px; }
.user-email { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .05em; }
.logout-btn {
  background: transparent; border: 1px solid var(--line-2); color: var(--ink-2);
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 100px; cursor: pointer; transition: all .2s;
}
.logout-btn:hover { border-color: var(--accent); color: var(--accent); }

.course-frame {
  width: 100%;
  height: calc(100vh - 50px);
  border: none;
  display: block;
}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
</head>
<body>

<div class="app-bar">
  <div class="app-brand">Claude<em>·101</em></div>
  <div class="app-user">
    <span class="user-email" id="userEmail">cargando…</span>
    <a href="/account" class="logout-btn" style="text-decoration: none;">Mi cuenta</a>
    <button class="logout-btn" onclick="logout()">Salir</button>
  </div>
</div>

<iframe class="course-frame" src="/course.html" title="Claude 101 — Curso" allow="autoplay"></iframe>

<script>
async function loadUser() {
  try {
    const r = await fetch('/api/auth/me');
    const data = await r.json();
    if (data.authenticated) {
      document.getElementById('userEmail').textContent = data.user.email;
    }
  } catch {}
}
loadUser();

let _logoutPending = false;
let _logoutTimer = null;
let _logoutBtn = null;
let _logoutOriginal = '';

async function logout() {
  if (!_logoutBtn) {
    _logoutBtn = document.querySelector('button.logout-btn[onclick*="logout"]') || document.querySelector('button[onclick*="logout()"]');
    if (_logoutBtn) _logoutOriginal = _logoutBtn.textContent;
  }

  if (_logoutPending) {
    // Segundo click dentro del plazo — logout real
    clearTimeout(_logoutTimer);
    _logoutPending = false;
    if (_logoutBtn) _logoutBtn.textContent = 'Saliendo...';
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/';
    return;
  }

  // Primer click — pedir confirmación
  _logoutPending = true;
  if (_logoutBtn) {
    _logoutBtn.textContent = '¿Seguro?';
    _logoutBtn.style.background = 'var(--accent)';
    _logoutBtn.style.color = 'var(--bg)';
    _logoutBtn.style.borderColor = 'var(--accent)';
  }
  _logoutTimer = setTimeout(() => {
    _logoutPending = false;
    if (_logoutBtn) {
      _logoutBtn.textContent = _logoutOriginal || 'Salir';
      _logoutBtn.style.background = '';
      _logoutBtn.style.color = '';
      _logoutBtn.style.borderColor = '';
    }
  }, 3000);
}
</script>
<script src="/track.js"></script>

<script>
// Guardar el email del usuario logueado para que /login lo autorrellene la próxima vez
(function saveEmailForLogin() {
  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && data.authenticated && data.user && data.user.email) {
        try { localStorage.setItem('c101_last_email', data.user.email.toLowerCase()); } catch {}
      }
    })
    .catch(() => {});
})();

</script>
</body>
</html>
