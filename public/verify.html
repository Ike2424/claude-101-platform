<!DOCTYPE html>
<html lang="es">
<head>
<!-- Google Analytics 4 -->
<script src="/ga.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar certificado · Claude 101</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4EFE3; --card: #FBF8F0; --ink: #1C1A16; --ink-2: #3A352D; --muted: #756B5B;
  --line: #E1D8C2; --line-2: #CFC4AA; --accent: #C8542B; --olive: #4F5D38;
  --display: 'Fraunces', Georgia, serif;
  --body: 'Geist', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--body); min-height: 100vh; padding: 24px; }

.shell { max-width: 680px; margin: 60px auto; }
.brand {
  text-align: center; font-family: var(--display); font-style: italic; font-size: 24px;
  margin-bottom: 60px; color: var(--ink);
}
.brand em { font-style: normal; color: var(--accent); }
.brand a { color: inherit; text-decoration: none; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  padding: 48px 40px; text-align: center;
  box-shadow: 0 8px 32px rgba(28,26,22,.06);
}

.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 100px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .15em;
  text-transform: uppercase; margin-bottom: 28px;
}
.status.valid { background: rgba(79,93,56,.12); color: var(--olive); border: 1px solid var(--olive); }
.status.invalid { background: rgba(200,84,43,.12); color: var(--accent); border: 1px solid var(--accent); }

h1 {
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: 38px; letter-spacing: -0.02em; margin-bottom: 12px; line-height: 1.1;
}
h1 em { font-style: normal; color: var(--accent); }
.lede { color: var(--ink-2); margin-bottom: 36px; }

.recipient-name {
  font-family: var(--display); font-weight: 400; font-size: 48px;
  color: var(--accent); margin: 24px 0; letter-spacing: -0.02em;
}
.recipient-name em { font-style: italic; }

.meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  border-top: 1px solid var(--line-2); padding-top: 24px; margin-top: 32px;
  font-family: var(--mono); font-size: 13px; text-align: left;
}
@media (max-width: 520px) { .meta { grid-template-columns: 1fr; } }
.meta .label {
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.meta .value { color: var(--ink); }

.cta {
  margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line);
}
.cta p { color: var(--muted); margin-bottom: 16px; font-size: 14px; }
.btn {
  display: inline-block;
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; padding: 12px 22px; border-radius: 100px;
  background: var(--ink); color: var(--card); text-decoration: none;
  border: 1px solid var(--ink);
}
.btn:hover { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<div class="shell">
  <div class="brand"><a href="/">Claude<em>·101</em></a></div>
  <div id="content">
    <div class="card">
      <p style="color: var(--muted);">Verificando certificado…</p>
    </div>
  </div>
</div>

<script>
async function load() {
  // Extraer código de la URL: /verify/CODE
  const code = location.pathname.split('/').filter(Boolean).pop();
  if (!code || code === 'verify') {
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="status invalid">✕ Sin código</div>
        <h1>Falta el <em>código</em></h1>
        <p class="lede">Pega la URL completa: /verify/CODIGO</p>
      </div>`;
    return;
  }

  try {
    const r = await fetch('/api/certificates/verify/' + encodeURIComponent(code));
    const data = await r.json();

    if (!data.valid) {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="status invalid">✕ No válido</div>
          <h1>Certificado <em>no encontrado</em></h1>
          <p class="lede">El código <code>${escapeHtml(code)}</code> no corresponde a ningún certificado emitido. Comprueba que está escrito correctamente.</p>
        </div>`;
      return;
    }

    const date = new Date(data.issued_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="status valid">✓ Certificado válido</div>
        <h1>Certificado <em>verificado</em></h1>
        <p class="lede">Emitido por academia101.com</p>
        <div class="recipient-name">${escapeHtml(data.full_name)}</div>
        <p style="color: var(--ink-2);">ha completado el curso<br><strong>${escapeHtml(data.course)}</strong></p>
        <div class="meta">
          <div>
            <div class="label">Fecha de emisión</div>
            <div class="value">${date}</div>
          </div>
          <div>
            <div class="label">Lecciones completadas</div>
            <div class="value">${data.lessons_completed} de 32</div>
          </div>
          <div>
            <div class="label">Código verificador</div>
            <div class="value">${escapeHtml(code)}</div>
          </div>
          <div>
            <div class="label">Emisor</div>
            <div class="value">${escapeHtml(data.issuer)}</div>
          </div>
        </div>
        <div class="cta">
          <p>¿Quieres tu propio certificado?</p>
          <a href="/" class="btn">Ver el curso →</a>
        </div>
      </div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="status invalid">✕ Error</div>
        <h1>No se pudo <em>verificar</em></h1>
        <p class="lede">${escapeHtml(e.message)}</p>
      </div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
load();
</script>
</body>
</html>
