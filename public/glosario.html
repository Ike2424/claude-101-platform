<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glosario · Claude 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --bg:#F4EFE3; --bg-2:#EFE9DA; --card:#FBF8F0;
  --ink:#1C1A16; --ink-2:#3A352D; --muted:#756B5B; --muted-2:#A39782;
  --line:#E1D8C2; --line-2:#CFC4AA;
  --accent:#C8542B; --olive:#4F5D38; --gold:#B08436;
  --display:'Fraunces',Georgia,serif;
  --body:'Geist',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
body{background-image:radial-gradient(circle at 12% 8%,rgba(200,84,43,.05) 0%,transparent 40%),radial-gradient(circle at 88% 92%,rgba(79,93,56,.04) 0%,transparent 40%);}

.top{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(251,248,240,.75);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10;}
.brand{font-family:var(--display);font-style:italic;font-size:18px;color:var(--ink);}
.brand em{font-style:normal;color:var(--accent);}
.brand-tag{margin-left:8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-style:normal;}
.nav-actions{display:flex;align-items:center;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line-2);color:var(--ink-2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:100px;cursor:pointer;text-decoration:none;transition:all .2s;}
.btn:hover{border-color:var(--ink-2);color:var(--ink);}

.container{max-width:1080px;margin:0 auto;padding:40px 28px 80px;}
.hero{margin-bottom:32px;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.hero h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(36px,5vw,52px);line-height:1.1;letter-spacing:-0.02em;color:var(--ink);margin-bottom:14px;}
.hero h1 em{font-style:normal;color:var(--accent);}
.hero p{font-size:16px;color:var(--muted);max-width:60ch;line-height:1.5;}

/* SEARCH + FILTERS */
.search-bar{position:sticky;top:73px;background:rgba(244,239,227,.92);backdrop-filter:blur(8px);padding:18px 0;margin-bottom:24px;z-index:5;border-bottom:1px solid var(--line);}
.search-input-wrap{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;}
.search-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,84,43,.08);}
.search-icon{font-size:16px;color:var(--muted);}
.search-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--body);font-size:15px;color:var(--ink);}
.search-input::placeholder{color:var(--muted-2);}
.search-count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;}

.filters{display:flex;flex-wrap:wrap;gap:8px;}
.filter-chip{background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 14px;font-family:var(--body);font-size:12px;color:var(--ink-2);cursor:pointer;transition:all .2s;}
.filter-chip:hover{border-color:var(--ink-2);}
.filter-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.filter-chip-count{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:4px;}

/* GLOSSARY GRID */
.glossary{display:grid;gap:14px;}
.term{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;scroll-margin-top:200px;}
.term:target{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,84,43,.08);}
.term-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.term-name{font-family:var(--display);font-size:24px;font-weight:600;color:var(--ink);line-height:1.2;}
.term-category{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:rgba(200,84,43,.08);padding:5px 10px;border-radius:100px;white-space:nowrap;}
.term-def{font-size:15px;color:var(--ink-2);line-height:1.55;margin-bottom:14px;}
.term-lessons{display:flex;flex-wrap:wrap;gap:6px;}
.term-lesson-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:6px;align-self:center;}
.lesson-link{display:inline-flex;align-items:center;gap:5px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:11px;color:var(--ink-2);text-decoration:none;transition:all .2s;}
.lesson-link:hover{border-color:var(--accent);color:var(--accent);background:rgba(200,84,43,.04);}
.lesson-link-arrow{font-size:10px;}

.term-highlight{background:rgba(176,132,54,.18);padding:0 2px;border-radius:2px;}

.empty{background:var(--card);border:1px dashed var(--line-2);border-radius:14px;padding:32px;text-align:center;}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.7;}
.empty-title{font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:8px;}
.empty-desc{font-size:14px;color:var(--muted);margin-bottom:0;}

@media (max-width:880px){
  .top{padding:14px 18px;}
  .container{padding:24px 18px 60px;}
  .hero h1{font-size:30px;}
  .search-bar{top:65px;padding:14px 0;}
  .term{padding:18px;}
  .term-head{flex-direction:column;gap:8px;}
  .term-name{font-size:20px;}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">Claude<em>·101</em> <span class="brand-tag">Glosario</span></div>
  <div class="nav-actions">
    <a href="/app" class="btn">← Curso</a>
    <a href="/app/progreso" class="btn">Mi progreso</a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="eyebrow">Referencia del curso</div>
    <h1>Términos <em>clave</em></h1>
    <p>Definiciones rápidas de los conceptos importantes del curso. Cada término enlaza a las lecciones donde se explica. Busca por nombre, definición o filtra por categoría.</p>
  </div>

  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar término o concepto..." autocomplete="off">
      <span class="search-count" id="searchCount">— términos</span>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="glossary" id="glossary"></div>
</div>

<script src="/claude-101-videos/glosario-data.js"></script>
<script>
const LESSON_LABELS = {};
// Construir labels desde la data
const MODULE_TITLES = {
  1: 'Bienvenida y fundamentos',
  2: 'Primeros pasos',
  3: 'El arte del prompt',
  4: 'Técnicas avanzadas',
  5: 'Capacidades y herramientas',
  6: 'Casos de uso prácticos',
  7: 'Buenas prácticas y límites',
  8: 'Siguiente nivel',
  9: 'Desarrollo avanzado'
};

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<span class="term-highlight">$1</span>');
}

let activeCategory = null;
let searchQuery = '';

function getCategories() {
  const counts = {};
  GLOSSARY.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1] - a[1]);
}

function renderFilters() {
  const wrap = document.getElementById('filters');
  const cats = getCategories();
  wrap.innerHTML = `<button class="filter-chip ${activeCategory ? '' : 'active'}" data-cat="">Todos <span class="filter-chip-count">${GLOSSARY.length}</span></button>` +
    cats.map(([cat, n]) => `<button class="filter-chip ${activeCategory === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)} <span class="filter-chip-count">${n}</span></button>`).join('');
  wrap.querySelectorAll('.filter-chip').forEach(b => b.addEventListener('click', () => {
    const cat = b.dataset.cat || null;
    activeCategory = activeCategory === cat ? null : cat;
    renderFilters();
    renderGlossary();
  }));
}

function renderGlossary() {
  const filtered = GLOSSARY.filter(t => {
    if (activeCategory && t.category !== activeCategory) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return t.term.toLowerCase().includes(q) || t.definition.toLowerCase().includes(q);
    }
    return true;
  }).sort((a, b) => a.term.localeCompare(b.term, 'es'));

  document.getElementById('searchCount').textContent = `${filtered.length} término${filtered.length === 1 ? '' : 's'}`;

  const wrap = document.getElementById('glossary');
  if (filtered.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🤷</div>
        <div class="empty-title">Sin resultados</div>
        <div class="empty-desc">No encontramos términos con "${escapeHtml(searchQuery)}". Prueba con otra palabra o quita filtros.</div>
      </div>`;
    return;
  }

  wrap.innerHTML = filtered.map(t => {
    const lessons = (t.lessons || []).map(lid => {
      const [_, mn, ln] = lid.match(/^l(\d+)-(\d+)$/) || [];
      if (!mn || !ln) return '';
      const fileId = lid.replace('l', 'L');
      return `<a class="lesson-link" href="/claude-101-videos/${fileId}-slides.html" target="_blank">Lección ${mn}.${ln} <span class="lesson-link-arrow">↗</span></a>`;
    }).join('');
    return `
      <div class="term" id="term-${escapeHtml(t.term.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, ''))}">
        <div class="term-head">
          <div class="term-name">${highlightMatch(t.term, searchQuery)}</div>
          <div class="term-category">${escapeHtml(t.category)}</div>
        </div>
        <div class="term-def">${highlightMatch(t.definition, searchQuery)}</div>
        ${lessons ? `<div class="term-lessons"><span class="term-lesson-label">Aparece en:</span>${lessons}</div>` : ''}
      </div>
    `;
  }).join('');
}

// Search input listener
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderGlossary();
});

// Initial render
if (typeof GLOSSARY === 'undefined' || !Array.isArray(GLOSSARY)) {
  document.getElementById('glossary').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">No pudimos cargar el glosario</div><div class="empty-desc">Recarga la página.</div></div>';
} else {
  renderFilters();
  renderGlossary();
}
</script>
</body>
</html>
